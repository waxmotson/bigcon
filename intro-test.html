<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE BIG CON — intro test</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="./static/css/fonts.css">
<style>
:root{--teal:#168388;--gold:#f5c542;--red:#ff3b30;--bg:#0b0d0c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:'Bricolage Grotesque',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
#stage{position:relative;width:min(92vw,620px,78vh);aspect-ratio:1/1;background:#000;overflow:hidden;cursor:pointer;
 box-shadow:0 0 0 2px #000,0 0 0 4px var(--teal),0 30px 80px rgba(0,0,0,.6)}
#stage *{position:absolute}
#table{inset:0;background:#1d201f radial-gradient(circle,rgba(22,131,136,.18) 1px,transparent 1.5px) 0 0/22px 22px;transform-origin:50% 50%}
#threads{left:0;top:0;width:100%;height:100%;overflow:visible}
#logo{inset:0;width:100%;height:100%;opacity:0}
#hole{background:#000}
#fx{inset:0}
#trails{left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.node{width:var(--nw);aspect-ratio:4/3;left:0;top:0;background:#111 center/cover no-repeat;border:2px solid #000;
 box-shadow:0 0 0 2px rgba(22,131,136,.9),0 8px 18px rgba(0,0,0,.7);will-change:transform,filter}
.node .glow{inset:-6px;border:3px solid var(--gold);box-shadow:0 0 18px var(--gold);opacity:0}
.pawn{left:0;top:0;width:var(--pw);height:var(--pw);border-radius:50%;overflow:hidden;background:#000;border:3px solid var(--gold);
 box-shadow:0 4px 10px rgba(0,0,0,.8);will-change:transform}
.pawn img{inset:0;width:100%;height:100%;object-fit:cover}
.msl{left:0;top:0;width:calc(var(--s)*.07);height:calc(var(--s)*.022);margin:calc(var(--s)*-.011) 0 0 calc(var(--s)*-.035);will-change:transform}
.msl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.jet{left:0;top:0;width:calc(var(--s)*.2);margin:calc(var(--s)*-.04) 0 0 calc(var(--s)*-.1);will-change:transform;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}
.boom{left:0;top:0;width:calc(var(--s)*.2);height:calc(var(--s)*.2);margin:calc(var(--s)*-.1) 0 0 calc(var(--s)*-.1);border-radius:50%;
 background:radial-gradient(circle,#fff 0 12%,#ffe066 22%,#ff9a1f 42%,rgba(255,59,48,.85) 58%,rgba(80,10,0,0) 72%);mix-blend-mode:screen;pointer-events:none}
.ring{left:0;top:0;width:calc(var(--s)*.2);height:calc(var(--s)*.2);margin:calc(var(--s)*-.1) 0 0 calc(var(--s)*-.1);border-radius:50%;border:3px solid #ffd27a;pointer-events:none}
#tile{background-repeat:no-repeat;opacity:0;transform-origin:50% 50%}
#tile .cv{background:#fff}
#stamp{left:50%;top:50%;padding:.2em .5em;border:.12em solid var(--red);color:var(--red);font-weight:900;letter-spacing:.12em;
 font-size:calc(var(--s)*.09);transform:translate(-50%,-50%) rotate(-14deg) scale(3);opacity:0;mix-blend-mode:screen;white-space:nowrap}
#flash{inset:0;background:#fff;opacity:0;pointer-events:none}
#shine{top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);pointer-events:none;transform:skewX(-12deg)}
.grain{inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.ctl{display:flex;gap:10px}
.ctl button{background:#000;color:#fff;border:1px solid var(--teal);padding:8px 16px;font:inherit;font-weight:800;letter-spacing:.1em;cursor:pointer}
.ctl button:hover{background:var(--teal)}
.note{font-size:12px;color:#9ad;letter-spacing:.06em}
</style>
</head>
<body>
<div id="stage" aria-label="THE BIG CON intro animation">
 <div id="table"><svg id="threads"></svg></div>
 <img id="logo" src="./big con logo.png" alt="THE BIG CON">
 <div id="hole"></div>
 <div id="fx"><svg id="trails"></svg></div>
 <div id="tile"></div>
 <div id="stamp">CONNED</div>
 <div id="shine"></div>
 <div id="flash"></div>
 <div class="grain"></div>
</div>
<div class="ctl"><button id="replay">↻ REPLAY</button><button id="skip">SKIP ⏭</button></div>
<div class="note">intro test · click the stage to skip · not wired into the game yet</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
<script>
(()=>{
gsap.registerPlugin(MotionPathPlugin);
const $=id=>document.getElementById(id);
const stage=$('stage'),table=$('table'),threads=$('threads'),logo=$('logo'),tile=$('tile'),stamp=$('stamp'),flash=$('flash'),shine=$('shine'),
 fx=$('fx'),trails=$('trails');
const G='./static/GlobalEdition/',P='./static/';

/* ---- the logo's own geometry (big con logo.png is 512×512) ---- */
const L=512;
const SLOTS={bessock:[85,88],calvinathanasius:[255,85],denialswan:[425,85],japsnchen:[85,255],thousandyardwax:[425,255],jimchalmers:[85,425],markwatson:[255,425],tomkins:[425,425]};
const FACE=160,BOX={x:166,y:170,w:186,h:174};
const ROWS=[[172,213],[232,273],[295,335]],COLS=[[172,220],[244,280],[304,347]];

/* ---- the board: a 5×5 grid of nodes [row, col]. kind: bond (BONDMAGEDDON's two), bank (its targets),
   lib (LIBERATE OIL: Trump, Big Yahu, Lockheed), oil (its targets) ---- */
const NODES={
 quik:{img:P+'quikstop.png',rc:[0,0]},          qantas:{img:P+'qantas.png',rc:[0,1]},           wti:{img:P+'wti crude.png',rc:[0,2],kind:'oil'},
 barrels:{img:P+'blue oil barrels.png',rc:[0,3],kind:'oil'}, aramco:{img:G+'saudi-aramco.jpg',rc:[0,4],kind:'oil'},
 cba:{img:P+'cba.png',rc:[1,0],kind:'bank'},    made:{img:P+'made logo.png',rc:[1,1]},          trump:{img:P+'trump.png',rc:[1,2],kind:'lib'},
 tanker:{img:P+'tanker fleet.png',rc:[1,3],kind:'oil'}, petronas:{img:P+'petronas.png',rc:[1,4],kind:'oil'},
 nab:{img:P+'nab.png',rc:[2,0],kind:'bank'},    bond:{img:P+'bond desk.png',rc:[2,1],kind:'bond'}, yahu:{img:G+'big-yahu.jpg',rc:[2,2],kind:'lib'},
 sisy:{img:P+'sisyphus.webp',rc:[2,3]},          cushing:{img:G+'cushing-oklahoma.jpg',rc:[2,4],kind:'oil'},
 anz:{img:P+'anz.png',rc:[3,0],kind:'bank'},    leak:{img:P+'bondmageddon 2.png',rc:[3,1],kind:'bond'}, lockheed:{img:G+'lockheed-martin.jpg',rc:[3,2],kind:'lib'},
 oilgraph:{img:P+'oil price increase.png',rc:[3,3],kind:'oil'}, pemex:{img:G+'pemex.png',rc:[3,4],kind:'oil'},
 westpac:{img:P+'westpac.png',rc:[4,0],kind:'bank'}, rock:{img:P+'the rock.gif',rc:[4,1]},     missile:{img:P+'GeographyDLC/nk_missile.jpg',rc:[4,2]},
 tuvalu:{img:P+'GeographyDLC/geo_tuvalu.png',rc:[4,3]}, petrobras:{img:G+'petrobras.jpg',rc:[4,4],kind:'oil'},
};
/* who stands where: DJT on Trump fires LIBERATE OIL, the CEO of Coal on the Bond Desk fires BONDMAGEDDON, the soldier minds Lockheed */
const PAWNS={markwatson:'bond',tomkins:'leak',DJT:'trump',thebigwegrzyn:'yahu',thousandyardwax:'lockheed',bessock:'quik',
 calvinathanasius:'qantas',Alexander_Lane:'made',denialswan:'sisy',thebigag:'rock',japsnchen:'missile',jimchalmers:'tuvalu'};
const F35=G+'fx/f35_travelling.png';
const MISSILE='<svg viewBox="0 0 70 22"><path d="M0 11 L-26 6 L-26 16 Z" fill="#ffb347" opacity=".9"/><path d="M-10 11 L-30 8 L-30 14 Z" fill="#fff3b0"/>'
 +'<rect x="4" y="7" width="50" height="8" rx="3" fill="#d9dde0" stroke="#000" stroke-width="1.5"/><path d="M54 7 Q68 11 54 15 Z" fill="#ff3b30" stroke="#000" stroke-width="1.5"/>'
 +'<path d="M8 7 L2 1 L14 7 Z M8 15 L2 21 L14 15 Z" fill="#8a9196" stroke="#000" stroke-width="1"/></svg>';

let tl=null,S=0,k=1,nodeEl={},pawnEl={},C={};
const R=gsap.utils.random;
const nw=()=>S*0.155,pw=()=>S*0.085;

/* a node's centre on the stage (a little jitter so it reads as a board, not a spreadsheet) */
const JIT={};
function layout(){
 C={};Object.entries(NODES).forEach(([id,n])=>{
  const j=JIT[id]||(JIT[id]=[R(-.018,.018),R(-.018,.018)]);
  C[id]=[S*(0.1+n.rc[1]*0.2+j[0]),S*(0.1+n.rc[0]*0.2+j[1])];
 });
}
/* the threads: right and down neighbours, a few gaps and a few diagonals */
const EDGES=(()=>{const ids=Object.keys(NODES),at={};ids.forEach(id=>at[NODES[id].rc.join()]=id);const out=[];
 ids.forEach(id=>{const [r,c]=NODES[id].rc;[[0,1],[1,0]].forEach(([dr,dc])=>{const o=at[(r+dr)+','+(c+dc)];if(o&&(r*7+c*3+dr)%5!==2)out.push([id,o])})});
 out.push(['quik','made'],['trump','tanker'],['yahu','oilgraph'],['bond','anz'],['lockheed','tuvalu'],['sisy','petronas']);return out})();

function build(){
 S=stage.clientWidth;k=S/L;layout();
 stage.style.setProperty('--s',S+'px');stage.style.setProperty('--nw',nw()+'px');stage.style.setProperty('--pw',pw()+'px');
 table.querySelectorAll('.node').forEach(n=>n.remove());stage.querySelectorAll('.pawn').forEach(n=>n.remove());
 fx.querySelectorAll(':scope > :not(svg)').forEach(n=>n.remove());trails.innerHTML='';threads.innerHTML='';
 trails.setAttribute('viewBox','0 0 '+S+' '+S);threads.setAttribute('viewBox','0 0 '+S+' '+S);
 EDGES.forEach(([a,b])=>{const p=document.createElementNS('http://www.w3.org/2000/svg','line');
  const long=Math.hypot(C[a][0]-C[b][0],C[a][1]-C[b][1])>S*0.25;
  Object.entries({x1:C[a][0],y1:C[a][1],x2:C[b][0],y2:C[b][1],stroke:'#168388','stroke-width':long?1.6:2.4,opacity:.9}).forEach(([k2,v])=>p.setAttribute(k2,v));
  p.dataset.long=long?1:0;threads.appendChild(p)});
 nodeEl={};Object.entries(NODES).forEach(([id,n])=>{const d=document.createElement('div');d.className='node';d.style.backgroundImage='url("'+n.img+'")';
  d.innerHTML='<div class="glow"></div>';table.appendChild(d);nodeEl[id]=d});
 pawnEl={};Object.keys(PAWNS).forEach(ch=>{const d=document.createElement('div');d.className='pawn';d.innerHTML='<img src="./characters/'+ch+'.png" alt="">';
  stage.insertBefore(d,tile);pawnEl[ch]=d});
 Object.assign(tile.style,{left:BOX.x*k+'px',top:BOX.y*k+'px',width:BOX.w*k+'px',height:BOX.h*k+'px',
  backgroundImage:'url("./big con logo.png")',backgroundSize:S+'px '+S+'px',backgroundPosition:(-BOX.x*k)+'px '+(-BOX.y*k)+'px'});
 Object.assign($('hole').style,{left:BOX.x*k+'px',top:BOX.y*k+'px',width:BOX.w*k+'px',height:BOX.h*k+'px'});
 tile.innerHTML='';
 ROWS.forEach(r=>COLS.forEach(c=>{const d=document.createElement('div');d.className='cv';
  Object.assign(d.style,{left:(c[0]-BOX.x)*k+'px',top:(r[0]-BOX.y)*k+'px',width:(c[1]-c[0])*k+'px',height:(r[1]-r[0])*k+'px'});tile.appendChild(d)}));
}
const nodeXY=id=>({x:C[id][0]-nw()/2,y:C[id][1]-nw()*0.375});
/* a pawn stands on the top-right corner of its node, so the picture stays readable */
const pawnXY=id=>({x:C[id][0]+nw()*0.5-pw()*0.75,y:C[id][1]-nw()*0.375-pw()*0.35});

function missile(t,a,b,at,dur){
 const m=document.createElement('div');m.className='msl';m.innerHTML=MISSILE;fx.appendChild(m);
 const mid=[(a[0]+b[0])/2+R(-.1,.1)*S,Math.min(a[1],b[1])-R(.1,.26)*S];
 const tr=document.createElementNS('http://www.w3.org/2000/svg','path');tr.setAttribute('d','M'+a[0]+','+a[1]+' Q'+mid[0]+','+mid[1]+' '+b[0]+','+b[1]);
 Object.entries({fill:'none',stroke:'rgba(230,230,230,.55)','stroke-width':S*0.007,'stroke-linecap':'round'}).forEach(([k2,v])=>tr.setAttribute(k2,v));
 trails.appendChild(tr);const len=tr.getTotalLength();gsap.set(tr,{strokeDasharray:len,strokeDashoffset:len,opacity:1});
 gsap.set(m,{x:a[0],y:a[1],opacity:0});
 t.set(m,{opacity:1},at)
  .to(m,{motionPath:{path:[{x:a[0],y:a[1]},{x:mid[0],y:mid[1]},{x:b[0],y:b[1]}],type:'quadratic',autoRotate:true},duration:dur,ease:'power1.in'},at)
  .to(tr,{strokeDashoffset:0,duration:dur,ease:'power1.in'},at)
  .set(m,{opacity:0},at+dur)
  .to(tr,{opacity:0,duration:0.5},at+dur);
 boom(t,b,at+dur);
}
function boom(t,p,at,big){
 const o=document.createElement('div');o.className='boom';fx.appendChild(o);
 const r=document.createElement('div');r.className='ring';fx.appendChild(r);
 gsap.set([o,r],{x:p[0],y:p[1],scale:0,opacity:0});
 const sc=big?1.5:1;
 t.fromTo(o,{scale:.1,opacity:1},{scale:sc,duration:0.22,ease:'power3.out',immediateRender:false},at)
  .to(o,{opacity:0,scale:sc*1.25,duration:0.35},at+0.22)
  .fromTo(r,{scale:.2,opacity:1},{scale:sc*1.5,opacity:0,duration:0.45,ease:'power2.out',immediateRender:false},at);
}
function jet(t,pts,at,dur){
 const j=document.createElement('img');j.className='jet';j.src=F35;fx.appendChild(j);
 gsap.set(j,{x:pts[0][0],y:pts[0][1],opacity:0});
 t.set(j,{opacity:1},at).to(j,{motionPath:{path:pts.map(([x,y])=>({x,y})),curviness:1.3,autoRotate:true},duration:dur,ease:'none'},at).set(j,{opacity:0},at+dur);
}
const shake=(t,at,n=4,a=7)=>t.to(stage,{x:a,y:-a*.6,duration:0.04,yoyo:true,repeat:n,clearProps:'x,y'},at);
/* a node reduced to rubble: it stays on the board, burnt out */
const rubble=(t,id,at)=>t.to(nodeEl[id],{filter:'grayscale(1) brightness(.4) contrast(1.5)',rotation:'+='+R(-12,12),scale:.92,duration:0.3,ease:'power2.out'},at);
/* a pawn fires its ability: it jumps, and its node(s) light up */
function fire(t,ch,ids,at){
 t.to(pawnEl[ch],{y:'-='+S*0.05,scale:1.35,duration:0.18,yoyo:true,repeat:1,ease:'power2.out'},at);
 ids.forEach(id=>t.to(nodeEl[id].firstChild,{opacity:1,duration:0.15,yoyo:true,repeat:3},at));
}

function play(){
 if(tl)tl.kill();
 build();
 gsap.set([logo,tile,stamp,flash,$('hole')],{opacity:0});gsap.set(stamp,{scale:3,xPercent:-50,yPercent:-50,rotate:-14,left:'50%',top:'50%',x:0,y:0});
 gsap.set(tile,{scale:1,x:0,y:0});gsap.set(stage,{x:0,y:0});gsap.set(shine,{left:'-40%'});
 gsap.set(table,{opacity:1,scale:1.35,filter:'none'});
 const ids=Object.keys(NODES);
 ids.forEach(id=>{const p=nodeXY(id);gsap.set(nodeEl[id],{...p,scale:0,rotation:R(-6,6),opacity:1,filter:'none'})});
 gsap.set([...threads.children],{opacity:0});
 Object.entries(PAWNS).forEach(([ch,id])=>{const p=pawnXY(id);gsap.set(pawnEl[ch],{x:p.x,y:p.y-S*0.6,scale:1,opacity:0,rotation:0,borderRadius:'50%',borderWidth:3})});
 tl=gsap.timeline();
 const T=l=>tl.labels[l];

 /* ACT ONE — the board deals itself: nodes pop in as a diagonal wave from Quikstop, the threads draw between them, the camera pulls back */
 tl.to(table,{scale:1,duration:2.6,ease:'power2.inOut'},0.1);
 ids.forEach(id=>{const [r,c]=NODES[id].rc;tl.to(nodeEl[id],{scale:1,duration:0.32,ease:'back.out(2)'},0.15+(r+c)*0.13+R(0,0.05))});
 [...threads.children].forEach((ln,i)=>{const len=Math.hypot(ln.x2.baseVal.value-ln.x1.baseVal.value,ln.y2.baseVal.value-ln.y1.baseVal.value);
  gsap.set(ln,{strokeDasharray:ln.dataset.long==='1'?'8 6':len,strokeDashoffset:ln.dataset.long==='1'?0:len});
  tl.to(ln,{opacity:.9,strokeDashoffset:0,duration:0.35,ease:'power1.out'},0.5+i*0.025)});

 /* ACT TWO — the crew drops onto the board, one pawn per node */
 tl.addLabel('crew',2.3);
 Object.keys(PAWNS).forEach((ch,i)=>tl.to(pawnEl[ch],{y:'+='+S*0.6,opacity:1,duration:0.42,ease:'bounce.out'},T('crew')+i*0.07));
 /* a couple of hops along the threads, to show they move */
 tl.to(pawnEl.bessock,{motionPath:{path:[pawnXY('quik'),{x:(pawnXY('quik').x+pawnXY('qantas').x)/2,y:pawnXY('quik').y-S*0.07},pawnXY('qantas')],curviness:1},duration:0.35},T('crew')+1.05)
   .to(pawnEl.bessock,{motionPath:{path:[pawnXY('qantas'),{x:(pawnXY('quik').x+pawnXY('qantas').x)/2,y:pawnXY('quik').y-S*0.07},pawnXY('quik')],curviness:1},duration:0.35},'>+0.05');
 tl.to(pawnEl.jimchalmers,{motionPath:{path:[pawnXY('tuvalu'),{x:(pawnXY('tuvalu').x+pawnXY('missile').x)/2,y:pawnXY('tuvalu').y-S*0.07},pawnXY('missile')],curviness:1},duration:0.35},T('crew')+1.15)
   .to(pawnEl.jimchalmers,{motionPath:{path:[pawnXY('missile'),{x:(pawnXY('tuvalu').x+pawnXY('missile').x)/2,y:pawnXY('tuvalu').y-S*0.07},pawnXY('tuvalu')],curviness:1},duration:0.35},'>+0.05');

 /* ACT THREE — BONDMAGEDDON: the Bond Desk and “Bond Markets Revolt” fire four missiles, one at each bank */
 tl.addLabel('bond',T('crew')+2.05);
 fire(tl,'markwatson',['bond','leak'],T('bond'));
 ['cba','nab','anz','westpac'].forEach((b,i)=>{
  const src=C[i%2?'leak':'bond'];
  missile(tl,[src[0]+nw()*0.4,src[1]],C[b],T('bond')+0.35+i*0.14,0.55);
  rubble(tl,b,T('bond')+0.9+i*0.14);
 });
 shake(tl,T('bond')+0.95,8,6);

 /* ACT FOUR — LIBERATE OIL: Trump and Big Yahu fire on every oil node, Lockheed scrambles the F-35s */
 tl.addLabel('oil',T('bond')+1.85);
 fire(tl,'DJT',['trump','yahu','lockheed'],T('oil'));
 const oils=ids.filter(id=>NODES[id].kind==='oil');
 oils.forEach((o,i)=>['trump','yahu'].forEach((src,j)=>missile(tl,[C[src][0]+R(-.02,.02)*S,C[src][1]-nw()*0.3],[C[o][0]+R(-.03,.03)*S,C[o][1]+R(-.02,.02)*S],T('oil')+0.3+i*0.09+j*0.045,0.6)));
 const lk=C.lockheed;
 for(let n=0;n<6;n++){const o=C[oils[(n*3)%oils.length]];
  jet(tl,[[lk[0],lk[1]],[S*R(.45,.6),S*R(.55,.9)],[o[0],o[1]],[S*1.3,S*R(-.3,1.2)]],T('oil')+0.25+n*0.13,1.1)}
 oils.forEach((o,i)=>{boom(tl,C[o],T('oil')+0.95+i*0.09,true);rubble(tl,o,T('oil')+0.98+i*0.09)});
 shake(tl,T('oil')+1.0,16,8);
 tl.to(flash,{opacity:0.8,duration:0.08},T('oil')+1.9).to(flash,{opacity:0,duration:0.5},T('oil')+1.98);

 /* ACT FIVE — the crew steps off the board and forms the logo; the four who are not in it are CONNED off the table */
 tl.addLabel('form',T('oil')+2.35);
 tl.to(table,{opacity:0,scale:0.9,filter:'blur(3px)',duration:0.7,ease:'power2.in'},T('form')+0.15);
 Object.keys(PAWNS).forEach(ch=>{
  const s=SLOTS[ch],d=pawnEl[ch];
  if(s){const sz=FACE*k;tl.to(d,{x:s[0]*k-pw()/2,y:s[1]*k-pw()/2,scale:sz/pw(),borderRadius:'0%',borderWidth:0,rotation:0,duration:0.7,ease:'back.out(1.2)'},T('form')+R(0,0.2))}
  else{const a=R(0,Math.PI*2);tl.to(d,{x:'+='+Math.cos(a)*S*1.2,y:'+='+Math.sin(a)*S*1.2,rotation:R(-540,540),duration:0.6,ease:'power2.in'},T('form')+0.1)}
 });
 tl.to(stamp,{opacity:1,scale:1,duration:0.18,ease:'power4.in'},T('form')+0.2);
 shake(tl,T('form')+0.38,3,6);
 tl.to(stamp,{opacity:0,duration:0.25},T('form')+0.75);
 tl.set('#hole',{opacity:1},T('form')+0.95);
 tl.to(logo,{opacity:1,duration:0.45},T('form')+1.0);
 tl.to(Object.keys(SLOTS).map(ch=>pawnEl[ch]),{opacity:0,duration:0.45},T('form')+1.0);
 tl.fromTo(tile,{opacity:0,scale:2.4,rotation:-6},{opacity:1,scale:1,rotation:0,duration:0.32,ease:'power4.in',immediateRender:false},T('form')+1.1)
   .set('#hole',{opacity:0},T('form')+1.42)
   .to(flash,{opacity:0.55,duration:0.04},T('form')+1.42)
   .to(flash,{opacity:0,duration:0.3},T('form')+1.46);
 shake(tl,T('form')+1.42,5,7);
 const covers=[...tile.children];

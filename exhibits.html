html,body{margin:0;padding:0}

.serif,#brand h1,.nm,.sechead h2,.mtitle,.mname{font-family:'Times New Roman',Times,serif}
/* ── header ── */

#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.tchip{font-family:inherit;font-size:11px;font-weight:800;letter-spacing:1px;padding:5px 11px;border:1px solid #168388;background:#000;color:#ddd;cursor:pointer;border-radius:2px;display:flex;gap:7px;align-items:center}
.tchip .sw{width:9px;height:9px;border-radius:2px;background:var(--c);flex:0 0 9px}
.tchip .n{color:#9ad;font-weight:700}

.tchip.on{background:#168388;color:#fff}

.tchip.all{border-color:#000;background:#111;color:burlywood}
.tchip.all.on{background:burlywood;color:#000}
#search{margin-left:auto;flex:1 1 200px;max-width:320px;min-width:140px;font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid #168388;background:#000;color:#fff}
#geoT{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px;color:#8fd;border:1px solid #168388;background:#000;padding:5px 10px;cursor:pointer;user-select:none}
#geoT input{accent-color:#168388;cursor:pointer}

main{max-width:1240px;margin:0 auto;padding:10px 14px 40px}
.sec{margin-top:24px;padding:15px 16px 17px;background:#141918;border:1px solid #344747;border-left:4px solid var(--c);box-shadow:0 8px 22px rgba(0,0,0,.22)}

.sechead h2{margin:0;font-size:21px;font-weight:900;letter-spacing:3px;color:var(--c)}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch;width:100%}
.card{min-width:0;background:#0d1110;border:1px solid #354747;border-top:4px solid var(--c);padding:11px 12px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.card:hover{transform:translateY(-2px);border-color:#168388;background:#101817}
.card.hit{border-color:#f5c542;box-shadow:0 0 0 1px #f5c542 inset}
.card.dim{opacity:.32}
.card.geo{border-left:6px solid #4f7a3a}
.nmrow{display:flex;align-items:flex-start;gap:8px}
.nm{margin:0;font-size:16.5px;font-weight:900;letter-spacing:1px;line-height:1.2}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pill{font-size:9.5px;font-weight:800;letter-spacing:1.2px;padding:2px 7px;border:1px solid #3a4a4a;color:#9ad;background:#000}
.pill.t{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 28%,#000)}
.pill.k{color:#f5c542;border-color:#6b5a2a}
.pill.g{color:#8fd;border-color:#4f7a3a}
.fig{background:#000;border:1px solid #2a3d3d;overflow:hidden}
.fig img{display:block;width:100%;height:auto;object-fit:cover}
.fig .ph{display:flex;align-items:center;justify-content:center;font-size:40px;background:#0a0d0d;aspect-ratio:140/58;width:100%}

.shot{font-size:11.8px;line-height:1.42;margin:0;color:#f2f2f2}
.chiprow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;border-top:1px dashed #2a3d3d;padding-top:7px}
.chiprow .lab{font-size:9px;font-weight:800;letter-spacing:2px;color:#6b7f7f;flex-basis:100%}
.chip,.xref,.erev{font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;background:#000;border:1px solid #365b5b;color:aqua;cursor:pointer;border-radius:2px}
.chip{border-color:#26494f}

#digest{max-width:1240px;margin:28px auto 30px;padding:0 14px}
.house-top{display:block;max-width:1212px;margin:18px auto 8px;background:#000;border:2px solid #168388}
.house-top summary{cursor:pointer;padding:12px 15px;font-weight:900;letter-spacing:2px;font-size:13px;color:#f5c542;list-style:none}
.house-top summary::before{content:'▸ ';color:#9ad}
.house-top[open] summary::before{content:'▾ '}
.house-top .dinner{padding:0 17px 16px;font-size:12.5px;line-height:1.65;color:#c9d6d6}
.house-top h4{margin:13px 0 3px;font-size:12px;letter-spacing:2px;color:#f5c542}
#digest details{background:#000;border:1px solid #168388;margin-bottom:10px}
#digest summary{cursor:pointer;padding:10px 14px;font-weight:800;letter-spacing:2px;font-size:12px;color:#9ad;list-style:none}
#digest summary::before{content:'▸ ';color:#f5c542}
#digest details[open] summary::before{content:'▾ '}
#digest .dinner{padding:0 16px 14px;font-size:12.5px;line-height:1.6;color:#c9d6d6}
#digest h4{margin:12px 0 3px;font-size:12px;letter-spacing:2px;color:#f5c542}
#digest .fine{font-size:10.5px;color:#6b7f7f;font-style:italic;margin-top:14px}
/* ── modal ── */
#ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;overflow-y:auto;padding:30px 12px}
#ovl.show{display:block}
#mcard{max-width:860px;margin:0 auto;background:#111413;border:2px solid #168388;box-shadow:0 30px 90px rgba(0,0,0,.8);position:relative}
#mclose{position:absolute;top:8px;right:10px;width:32px;height:32px;border:1px solid #168388;background:#000;color:#fff;font-size:16px;font-weight:800;cursor:pointer;z-index:2}
#mclose:hover{background:#168388}
#mnav{position:absolute;top:8px;right:52px;display:flex;gap:5px;z-index:2}

.mhero img{width:100%;max-height:300px;object-fit:cover;display:block;background:#000;border-bottom:2px solid #168388}
.mhero .ph{height:200px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#0a0d0d;border-bottom:2px solid #168388}
.mbody{padding:14px 18px 18px}
.mname{margin:0;font-size:24px;font-weight:900;letter-spacing:2px;line-height:1.15}
#mcard .mbody .pillrow{margin:8px 0 10px}
#mcard .mmech{font-size:13px;line-height:1.6;color:#d8dcdc}
#mcard .mmech ul{margin:4px 0;padding-left:18px}

#mpos{position:absolute;bottom:8px;right:12px;z-index:2;font-size:10px;letter-spacing:2px;color:#9ad;background:rgba(0,0,0,.55);border:1px solid #1d4a4a;padding:3px 8px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.sec{padding:12px 11px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}}
@media(max-width:480px){.cards{grid-template-columns:1fr}.sechead h2{font-size:18px}#brand h1{font-size:19px}}
@media print{#brand .row1,#bar,#digest,#mnav,#mclose{display:none!important}.card{break-inside:avoid}}
</style>
</head>

{id:'fox',img:'./static/fox business.png',name:['FOX BUSINESS'],type:'MEDIA',shape:'logo',icon:'🦊',inc:2,cost:10,sub:'fair & furious',short:'Unlocks FOX SPIN ($2): −3 own Cortisol, or roast a rival for +1.',mech:'<ul><li><b>Action · FOX SPIN ($2, once per turn):</b> −3 Cortisol for yourself ("we’ll have CHOICE right after these messages") or roast a rival +1. Same once-per-turn desk as the press room — spin is shared.</li><li><b>Damage control:</b> a leaked CEO photo on your <span class="xref" data-id="coal">COAL CORP HQ</span> is trimmed to a $3 fee if you hold FOX (or the press room) instead of the +3 Cortisol.</li><li>Chyron feed: hold FOX and the <span class="xref" data-id="stock">STOCK-MARKET CHARTS</span> together and the charts earn a bonus <b>+$1/turn</b> — the same package <span class="xref" data-id="term">THE TERMINAL</span> sells.</li><li>Counted alongside everyone else on MEDIA mood days (+$1 each in a FRENZY).</li></ul>',rel:['stock','press','coal','news','jim'],evt:[['ceophoto','+$3 cover']]},
{id:'leak',img:'./static/bondmageddon 2.png',name:['“BONDMAGEDDON”','THE LEAK'],type:'MEDIA',shape:'bubble',icon:'📰',inc:2,cost:6,sub:'someone talked',short:'Seize it and gain 1 Intel on the spot · +$2 whenever BONDMAGEDDON runs.',mech:'<ul><li><b>Catch:</b> seizing the leak pays 1 Intel immediately.</li><li><b>On the deck:</b> +$2 whenever <span class="erev" data-ev="bondrevolt">BONDMAGEDDON</span> runs — the leak is always first with it.</li><li>One of the JTPORTAL blackjack — the room next to <span class="xref" data-id="press">THE PRESS ROOM</span> and of <span class="xref" data-id="photo">THE BIG CON</span>’s wall of stickers.</li></ul>',rel:['press','bond','jt','photo','back'],evt:[['bondrevolt','+$2']]},
{id:'jim',img:'./static/jim chalmers breaking news.jpg',name:['“THE JIM…”','TREASURY EXCLUSIVE'],type:'MEDIA',shape:'news',icon:'🗞️',inc:1,cost:4,sub:'bond-market news graphic',short:'+$2 whenever a GOVERNMENT event runs — budgets and rate decisions sell papers.',mech:'<ul><li><b>On the deck:</b> +$2 whenever <span class="erev" data-ev="budget">THE JIM DELIVERS THE BUDGET</span> or <span class="erev" data-ev="rates">THE RBA CASH-RATE DECISION</span> lands.</li><li><b>Event shield:</b> holding THE JIM saves the holder 1 point of any event Cortisol (a +2 event becomes +1; a +1 event is buried entirely).</li><li>Front page of the CHALMERS book with <span class="xref" data-id="chalmers">JIM CHALMERS</span> and <span class="xref" data-id="herald">THE JIM REAPER</span> — more than two and the regulators read it too.</li></ul>',rel:['chalmers','herald','rba','gov','bess'],evt:[['budget','+$2'],['rates','+$2']]},
{id:'herald',img:'./static/the jim reaper.png',name:['HERALD SUN','THE JIM REAPER'],type:'MEDIA',shape:'news',inc:1,cost:4,sub:'front page, every page',short:'+$2 on GOVERNMENT events · +1 Intel whenever any rival gains event-Cortisol.',mech:'<ul><li><b>On the deck:</b> +$2 whenever <span class="erev" data-ev="budget">THE BUDGET</span> or <span class="erev" data-ev="rates">THE RATE DECISION</span> runs.</li><li><b>The Reaper files:</b> every time a rival takes event Cortisol, +1 Intel — but the paper writes nothing when the story gets buried (a rival holding <span class="xref" data-id="bess">BIG BESSENT</span> or THE JIM can soften +1 events to nothing, and then the reaper goes hungry).</li><li>Part of the CHALMERS book (with <span class="xref" data-id="chalmers">"THE JIM"</span>), and pinned next to the <span class="xref" data-id="gov">COAT OF ARMS</span> and the <span class="xref" data-id="chalmers">Treasurer</span> on the upper gallery.</li></ul>',rel:['chalmers','gov','jim','bess'],evt:[['budget','+$2'],['rates','+$2']]},
{id:'bess',img:'./static/big bessent breaking news.jpg',name:['“BIG BESSENT”','BREAKING'],type:'MEDIA',shape:'bubble',icon:'📣',inc:1,cost:4,sub:'the big man talks, the markets obey',short:'+$2 whenever a BOND or RATE event runs — he softens your own event-Cortisol too.',mech:'<ul><li><b>On the deck:</b> +$2 whenever <span class="erev" data-ev="bondrevolt">BONDMAGEDDON</span> or <span class="erev" data-ev="rates">THE CASH-RATE DECISION</span> runs. Notably <span class="erev" data-ev="besspeak">BIG BESSENT SPEAKS</span> does <span class="neg">not</span> pay the graphic — the man himself banks that one.</li><li><b>Event shield:</b> while you hold this breaking-news sticker, every event Cortisol aimed at you is softened by 1 (a +1 event is buried to nothing).</li><li>BESSENT book with <span class="xref" data-id="bessent">SCOTT BESSENT</span> and <span class="xref" data-id="bond">THE BOND DESK</span> — more than two invites the regulators.</li></ul>',rel:['bessent','bond','jim','herald','brad'],evt:[['bondrevolt','+$2'],['rates','+$2']]},
{id:'quik',img:'./static/quikstop.png',name:['QUIKSTOP'],type:'CORPORATE',shape:'logo',icon:'⛽',inc:2,cost:5,sub:'the storefront · fuel, snacks & shopping bags',short:'Every player starts here. Collects $1 from every rival on OIL SPIKES · +$4 on PROFIT WARNING · −$2 on the ROBBERY.',mech:'<ul><li><b>The start line:</b> every player plants their token at Quikstop — and the storefront re-sites itself between games (five possible slots on the canonical collage, dealt at random).</li><li><b>Fuel is money:</b> when <span class="erev" data-ev="oilspike">OIL SPIKES</span> runs, each rival pays you $1 at the pump (unowned, the table pays the void).</li><li><b>On the deck:</b> +$4 “snack economics” when <span class="erev" data-ev="profit">PROFIT WARNING… FOR OTHERS</span> runs — but a <span class="erev" data-ev="quikrob">QUIKSTOP ROBBERY</span> takes $2 straight out of the register (and <span class="xref" data-id="bond007">JAMES BOND</span>’s owner banks $2 of the excuse).</li><li><b>The anchor:</b> <span class="xref" data-id="market">MARKETPLACE</span> pays its holder +$2 for keeping you. <span class="xref" data-id="citi">CITI TOWER</span> counts you in the corporate payday.</li></ul>',rel:['market','oil','bond007','citi','trump','forklift'],evt:[['oilspike','$1 from every rival'],['profit','+$4'],['quikrob','−$2']]},
{id:'market',img:'./static/marketplace.webp',name:['MARKETPLACE','LEICHARDT'],type:'CORPORATE',shape:'logo',icon:'🛍️',inc:2,cost:5,sub:'shopping centre · interior & exterior',short:'+$2 income while you also own QUIKSTOP — the anchor tenant.',mech:'<ul><li><b>Payday:</b> +$2 per turn while you also hold <span class="xref" data-id="quik">QUIKSTOP</span>.</li><li>Pits hard against <span class="xref" data-id="bhp">BHP</span> on the collage — retail meets the big Australian.</li><li><span class="xref" data-id="citi">CITI TOWER</span>’s payday counts it; more than two CORPORATE-type holdings invites the <span class="xref" data-id="accc">ACCC</span>.</li></ul>',rel:['quik','bhp','citi','f1'],evt:[]},
{id:'f1',img:'./static/f1.png',name:['FORMULA 1','RACING CAR'],type:'CORPORATE',shape:'photo',icon:'🏎️',inc:2,cost:6,sub:'sponsorship pays',short:'Unlocks THE SLIPSTREAM ($2, during movement, once per turn): +2 steps and your next seizure this turn costs $2 less.',mech:'<ul><li><b>Action · THE SLIPSTREAM ($2, once per turn, during movement):</b> draw +2 movement steps <i>and</i> get $2 off your next hostile takeover this turn (never below $1).</li><li>Usable as its own move phase spend — or through <span class="xref" data-id="back">BACKROOM DEALS</span> (−2 movement steps) like any node ability.</li><li>Free split-step tech: slip a 2-step gap into a longer walk, then watch the takeover discount disappear at turn end.</li><li><span class="xref" data-id="citi">CITI TOWER</span> counts it; CORPORATE concentration (>2) opens an <span class="xref" data-id="accc">ACCC</span> file.</li></ul>',rel:['back','citi','qantas','market','coal'],evt:[]},
{id:'qantas',img:'./static/qantas.png',name:['QANTAS','THE FLYING KANGAROO'],type:'CORPORATE',shape:'logo',icon:'✈️',inc:2,cost:20,sub:'the spirit of australia',short:'Unlocks FLY THE JET ($3, during movement): teleport to ANY node — action ends the walk. Takeovers never inflate above its $20 list price.',mech:'<ul><li><b>Action · FLY THE JET ($3, during movement):</b> jump to literally any pin — no serial scheme, no tolls on landing (walking may charge you; flying never does) and the flight ends your walk (`steps → 0`). Cheapest reach on the board for the far seeds.</li><li><b>The card-cost myth:</b> despite what the game copy says, the engine does <span class="neg">not</span> gate the jet on turn 1 — from the very first round, if you\'re the owner and have $3, you can go anywhere.</li><li><b>Flat price forever:</b> hostile takeovers of Qantas always cost the $20 list — it never doubles (like the <span class="xref" data-id="rba">RBA</span> and <span class="xref" data-id="made">MADE</span>).</li><li><b>On the ground:</b> if <span class="xref" data-id="geo_boeing">THE CORPORATE BOEING</span>’s owner shuts it down, the jet pays <span class="neg">no income at all</span>, and nobody can walk in, land, or take it for two full turns.</li><li><b>Deals:</b> counted by <span class="xref" data-id="citi">CITI TOWER</span>; sits hard beside <span class="xref" data-id="press">THE PRESS ROOM</span> and <span class="xref" data-id="golf">THE GOLF CLUB</span> on the collage.</li></ul>',rel:['citi','geo_boeing','rba','made','press','golf','f1','bullet'],evt:[]},
{id:'bullet',img:'./static/bullet train.png',name:['THE BULLET TRAIN'],type:'CORPORATE',icon:'🚄',inc:2,cost:6,sub:'fast enough to outrun a hearing',short:'+1 movement step each turn while owned. Does not stack with THE COAL TRAIN — pick the faster service.',mech:'<ul><li><b>Every turn:</b> +1 movement step. Owning <span class="xref" data-id="train">THE COAL TRAIN</span> as well gives <span class="neg">nothing extra</span> — the engine counts exactly one rail service per turn: <i>train <b>or</b> bullet</i>.</li><li>The rest of the stack is arithmetic (verified in the engine): base <b>3</b> steps, +1 <span class="xref" data-id="coal">COAL CORP HQ</span>, +1 <i>either</i> rail service, +1 <span class="xref" data-id="asics">ASICS</span>, +1 by burning a favour — a full stack walks <b>6</b> pins a turn.</li><li>Under caution that collapses to 1 step; hospital-red tokens walk slower.</li><li><span class="xref" data-id="citi">CITI TOWER</span> counts it.</li></ul>',rel:['train','coal','asics','citi','albo','golf'],evt:[]},
{id:'insider',img:'./static/insider trading graphic.png',name:['“INSIDER TRADING”','THE GRAPHIC'],type:'MEDIA',shape:'news',icon:'⚠️',inc:1,cost:4,sub:'circled in red marker',short:'Your BUG actions cost 0 Intel — it’s only insider trading if you’re on the outside.',mech:'<ul><li><b>Free bugs:</b> plant a bug on any rival node for free (normally 1 Intel) — the skim still pays $1/turn, $2 with the <span class="xref" data-id="wef">WEF</span>.</li><li><b>Skims:</b> a bug on someone else’s pin pays its skim even on their payday; the graphic doesn’t need to be anywhere near the bug.</li><li>Bugs are pulled when a node is seized, when the owner divests under ACCC pressure, and when raided.</li></ul>',rel:['wef','photo','back','whistle'],evt:[]},
{id:'photo',img:'./static/the big con.png',name:['THE BIG CON'],type:'MEDIA',icon:'📷',inc:1,cost:5,sub:'faces pinned to cork',short:'+1 Intel whenever any RIVAL seizes a node — the wall sees everything.',mech:'<ul><li><b>Eyes on the wall:</b> every seizure made by another player pays its owner +1 Intel — the only board surveillance that never sleeps. Your own seizures pay nothing.</li><li><b>Coma:</b> cheap to run at $1/turn income — a rival who seizes only hands you more evidence.</li><li>Made to sit near <span class="xref" data-id="leak">THE LEAK</span>, <span class="xref" data-id="bigshort">THE BIG SHORT</span> and <span class="xref" data-id="made">MADE</span> in the basement gallery.</li></ul>',rel:['leak','bigshort','made','news','insider','jt'],evt:[]},
{id:'bigshort',img:'./static/the big short.png',name:['THE BIG SHORT','THE CINEMA'],type:'MEDIA',shape:'logo',icon:'🎬',inc:1,cost:4,sub:'they explained it with a Jenga tower',short:'+$3 whenever a crash event runs — BONDMAGEDDON, MONOPOLY ALERT or THE BIG SHORT SCREENING.',mech:'<ul><li><b>On the deck:</b> +$3 whenever <span class="erev" data-ev="bondrevolt">BONDMAGEDDON</span> runs (“the cinema saw it coming”), +$3 when <span class="erev" data-ev="crackdown">MONOPOLY ALERT</span> lands the fine, and +$3 when <span class="erev" data-ev="bigscreen">THE BIG SHORT SCREENING</span> packs the house.</li><li>The premium middle-ground pin: cheap ($4) with three different triggers, so it never fights the mood — it eats the fallout whatever happens.</li><li><span class="xref" data-id="brad">BRAD PITT</span> and <span class="xref" data-id="hedge">THE HEDGE FUND</span> make a second screening crew: their bonuses ride alongside yours.</li></ul>',rel:['brad','hedge','photo','made','news'],evt:[['bondrevolt','+$3'],['crackdown','+$3'],['bigscreen','+$3']]},
{id:'news',img:'./static/all the newspapers.jpg',name:['THE NEWSPAPERS','ALL OF THEM'],type:'MEDIA',shape:'news',inc:1,cost:3,sub:'interest-rate clippings & small headlines',short:'+1 Intel at the start of your turn while you own 2+ MEDIA nodes.',mech:'<ul><li><b>Every turn:</b> +1 Intel if you hold two or more <b>MEDIA</b> pins (this one counts).</li><li>The cheapest pin on the board — a $3 door into the win-set, and its idle skill scales with every further sticker you grab.</li><li>It stacks with every other per-turn intel: <span class="xref" data-id="whistle">THE WHISTLEBLOWER</span>, <span class="xref" data-id="jt">JTPORTAL</span>, <span class="xref" data-id="mpc">THE COMPETITION</span>, <span class="xref" data-id="school">SCHOOL</span> (3+ charts), <span class="xref" data-id="herald">THE REAPER</span> (event mugs) and <span class="xref" data-id="bullock">THE GOVERNOR</span> can all pay Intel in the same phase.</li></ul>',rel:['fox','press','jt','whistle','herald','bullock','made'],evt:[]},
{id:'wef',img:'./static/world economic forum.webp',name:['WORLD ECONOMIC','FORUM'],type:'MEDIA',shape:'logo',icon:'🏔️',inc:2,cost:6,sub:'the conference stage',short:'Your bugs skim $2 instead of $1 · DAVOS pays the stage $3.',mech:'<ul><li><b>Ski-trip upgrade:</b> every bug you own pays +$2/turn instead of +$1.</li><li><b>On the deck:</b> when <span class="erev" data-ev="davos">DAVOS — THE CONFERENCE STAGE</span> runs, the stage banks +$3, <span class="xref" data-id="bessent">SCOTT BESSENT</span>’s owner collects +$2 — and for one round every bug <i>on the board</i> skims +$1 for its owner, whatever they hold.</li><li>DAVOS sets the mood to <span class="hot">FRENZY</span> — media pins cash the +$1 each.</li><li>Best friends with <span class="xref" data-id="insider">INSIDER TRADING</span>: free bugs at double skim.</li></ul>',rel:['insider','bessent','brad','jt','iface'],evt:[['davos','+$3 · global skim']]},
/* ── the backrooms ── */
{id:'back',img:'./static/backroom deals.png',name:['BACKROOM DEALS'],type:'WILD',icon:'🤝',inc:1,cost:4,sub:'cash · intel · favors',short:'Cover up to $3 of any seizure shortfall with Intel (1 🛈 = $1) · unlocks LEAN ON THE TABLE: every rival +1 Cortisol.',mech:'<ul><li><b>Credit line:</b> not enough cash for a seize? The room lets you cover up to $3 of the shortfall at 1 Intel per dollar — it asks first, so you may still walk away.</li><li><b>Action · LEAN ON THE TABLE:</b> squeeze every rival for +1 Cortisol (used in the action phase, like <span class="xref" data-id="rock">THE ROCK</span>’s COOK THE BOOKS). Any rival holding ≤1 exhibit shakes it off — the first acquisition is forgiven.</li><li><b>One ability per turn, 2 steps:</b> during a walk you may trigger ONE node ability through the backroom (audit, tweet, budget, cook, spin, fox-spin, slipstream, push, jog…) for −2 movement steps.</li><li>Seizing the room is also its own +1/turn income and matches <span class="xref" data-id="infl">INFLATION</span>’s edge.</li></ul>',rel:['infl','jt','press','whistle','leak','term'],evt:[]},
{id:'term',img:'./static/bloomberg terminal.png',name:['THE TERMINAL'],type:'WILD',icon:'📈',inc:1,cost:4,sub:'the screens never sleep',short:'End movement here to PEEK at the top Event card — keep it on top or bury it at the bottom.',mech:'<ul><li><b>The peek:</b> finish your walk on the terminal (you must own it) and get a free look at tomorrow’s market event. Then choose: leave it on top, or bury it at the bottom of the deck.</li><li>Burying is a sanctuary play — park the <span class="erev" data-ev="tariffs">TARIFFS</span> or <span class="erev" data-ev="crackdown">CRACKDOWN</span> you cannot afford right now at the bottom of the deck for a full cycle.</li><li><b>Online:</b> <span class="xref" data-id="iface">THE MARKET INTERFACE</span> makes the same peek work wherever you end movement.</li><li>Fast data: <span class="xref" data-id="stock">STOCK-MARKET CHARTS</span> pay +$1/turn to their holder while you hold this.</li></ul>',rel:['iface','stock','bessent','back'],evt:[]},
{id:'golf',img:'./static/golf club.jpg',name:['THE GOLF CLUB'],type:'WILD',icon:'⛳',inc:2,cost:6,sub:'deals on the back nine',short:'All your seizure costs are $1 cheaper.',mech:'<ul><li><b>Every seize:</b> −$1 on whatever you are taking — unowned or takeover, stackable with <span class="xref" data-id="nab">NAB</span>’s $1-off charts (a $2 chart seizes for $1… or free — floored at $1).</li><li>Deals happen on the back nine next to <span class="xref" data-id="qantas">QANTAS</span>, <span class="xref" data-id="watson">MARK WATSON</span> and the press.</li><li>Remember: takeover cost doubles every round a pin is re-taken (2× list, then 4×, 8×…) — the golf discount applies only once per deal.</li></ul>',rel:['qantas','watson','press','nab','tenyear'],evt:[]},
{id:'whistle',img:'./static/whistelblower.png',name:['THE WHISTLEBLOWER','KNOWS TOO MUCH'],type:'WILD',shape:'photo',icon:'🕵️',inc:0,cost:6,sub:'half a confession ready',short:'+1 Intel at the start of each of your turns · +2 Intel instead of losing any on TAPES.',mech:'<ul><li><b>Every turn:</b> +1 Intel on payday.</li><li><b>On the deck:</b> when <span class="erev" data-ev="tapes">THE TAPES GO MISSING</span> runs, the whistleblower <span class="pos">keeps copies</span> — +2 Intel while everyone else burns one.</li><li>One of the few $0 pins that still trickles — a fresh contact (1 🛈) every single payday.</li><li>Cluster: pinned with <span class="xref" data-id="jt">JTPORTAL</span> — they read the board, this reads the tape.</li><li>Also reads: the relic hides the <span class="xref" data-id="insider">INSIDER TRADING</span> graphic and <span class="xref" data-id="back">BACKROOM DEALS</span>.</li></ul>',rel:['insider','back','photo','jt','toktimer'],evt:[['tapes','kept copies (+2)']]},
{id:'iface',img:'./static/bloomberg terminal.png',name:['THE MARKET','INTERFACE'],type:'WILD',icon:'🖥️',inc:1,cost:4,sub:'computer & website screenshots',short:'Your TERMINAL peek works wherever you end movement — everything is online.',mech:'<ul><li><b>Any end-stop:</b> with the interface, a <span class="xref" data-id="term">TERMINAL</span> peek fires every turn wherever you finish walking — no need to detour there.</li><li><b>Remote reading:</b> wired straight to <span class="xref" data-id="wef">THE WEF LOBBY</span> and its east-wing neighbour <span class="xref" data-id="toktimer">TOKTIMER</span> — the clock runs off the same network.</li><li><span class="xref" data-id="term">THE TERMINAL</span> pin next door — same image, different job.</li></ul>',rel:['term','jt','wef','toktimer','back'],evt:[]},
{id:'school',img:'./static/st andrews cathedral school.png',name:['ST ANDREW’S','CATHEDRAL SCHOOL'],type:'WILD',shape:'logo',icon:'🏫',inc:1,cost:5,sub:'the crest & the tower',short:'+1 Intel at the start of your turn if you own 3+ CHART nodes.',mech:'<ul><li><b>Every turn:</b> +1 Intel once your chart book reaches 3 (the research department).</li><li><b>On the deck:</b> +$2 whenever <span class="erev" data-ev="mpcfinals">MPC FINALS</span> runs (the school places), but the <span class="erev" data-ev="ibexams">IB EXAMS</span> event bites anyone without charts.</li><li><b>The EDUCATION book:</b> the crest, <span class="xref" data-id="ib">THE IB DIPLOMA</span> and <span class="xref" data-id="mpc">THE COMPETITION</span> — more than two invites the <span class="xref" data-id="accc">ACCC</span>.</li></ul>',rel:['ib','mpc','golf','school'],evt:[['mpcfinals','+$2']]},
{id:'ib',img:'./static/ibdp.png',name:['THE IB DIPLOMA','PROGRAMME'],type:'WILD',icon:'📚',inc:1,cost:5,sub:'HL Economics, allegedly',short:'Your CHART nodes pay DOUBLE income (Higher Level Economics).',mech:'<ul><li><b>Every turn:</b> doubles the income of each <b>CHART</b> node you own — including its event earnings are NOT duplicated, you conserve the bonuses by playing <span class="xref" data-id="us">US BOND YIELDS</span> (+$2 on tariffs), <span class="xref" data-id="cash">CASH-RATE CHART</span> (+$2 on rates).</li><li><b>Works on intervention:</b> pays in <span class="xref" data-id="tenyear">THE MASTER</span>’s own dollar too… and remember a base-$0 chart (US, Japan, UK, Aus alone) stays $0 even doubled — income = max(doubled).</li><li><b>a safe for MPC:</b> <span class="xref" data-id="mpc">THE COMPETITION</span> adds +$2/turn more if you also hold school AND diploma.</li><li>Also pairs with <span class="xref" data-id="infl">INFLATION COMPENSATION</span> for +$2 salary base doubling (just +$1).</li></ul>',rel:['tenyear','us','cash','infl','mpc','school'],evt:[['ibexams','+$2']]},
{id:'mpc',img:'./static/monetary policy competition.png',name:['THE AUSTRALIAN','MONETARY POLICY','COMPETITION'],type:'WILD',shape:'mpc',icon:'🏆',inc:1,cost:6,sub:'the trophy of trophies',short:'+$1 income per CHART node · +1 Intel each turn · +$2 more per turn with SCHOOL + IB.',mech:'<ul><li><b>Every turn:</b> +$1 per <b>CHART</b> you hold, +1 Intel, and a further +$2/turn while you hold <span class="xref" data-id="school">SCHOOL</span> AND <span class="xref" data-id="ib">THE IB DIPLOMA</span> (the trophy needs the whole study group).</li><li><b>On the deck:</b> <span class="erev" data-ev="mpcfinals">MPC FINALS</span> pays the champions’ purse — +$4 and +1 Intel — and JTPortal thumbs a judging point to the trophy’s owner.</li><li><b>Matters MORE:</b> this is the centrepiece of the MONETARY POLICY industry (with the RBA, cash chart, <span class="xref" data-id="infl">inflation</span> and <span class="xref" data-id="bullock">the Governor</span>) — the one book the <span class="xref" data-id="asic">ASIC</span> reads as market manipulation instead of monopoly.</li></ul>',rel:['school','ib','rba','cash','infl','bullock','asic'],evt:[['mpcfinals','+$4 +1 Intel']]},
{id:'sisy',img:'./static/sisyphus.webp',name:['THE SISYPHUS','BOULDER'],type:'WILD',inc:0,cost:4,sub:'it always rolls back down',short:'Stand here (once owned) to PUSH: earn $10 the first time, then the payout doubles with every push. No Cortisol cost.',mech:'<ul><li><b>PUSH the boulder:</b> from your boulder, as your action (or mid-walk via <span class="xref" data-id="back">BACKROOM DEALS</span>, −2 steps), bank the counter and <span class="pos">no Cortisol</span>. The counter starts at $10 and doubles every push: $10 → $20 → $40 → $80…</li><li><b>It always rolls back (this is the reset, and it’s brutal):</b> leave the boulder and the next payout is back to $10 — <i>unless you also own BACKROOM DEALS</i>, which remembers the streak. Losing the boulder (raid, ACCC divestment) also resets it.</li><li><b>On the deck:</b> when <span class="erev" data-ev="sisyroll">THE BOULDER ROLLS BACK DOWN</span> runs, the player with the most nodes pays a $2 fine — the boulder’s owner is always immune.</li><li>A favourite stopping spot: end movement here, push as your action, then keep walking next turn with a doubled counter… if nothing else sent the boulder home.</li></ul>',rel:['back','sat','jt'],evt:[['sisyroll','immune · rival −$2']]},
{id:'group',img:'./static/the outdoors.png',name:['THE OUTDOOR','GROUP PHOTOGRAPH'],type:'WILD',shape:'photo',icon:'👥',inc:1,cost:3,sub:'everyone smiled',short:'+1 Intel whenever ANY player is raided.',mech:'<ul><li><b>Raid papers:</b> every raid on the board — yours or a rival’s — pays this photograph +1 Intel.</li><li>A cheap pin ($3) whose sole job is to profit from the nastiest event on the board; make raids <i>more</i> tempting for other players by getting out of the way.</li><li>Echoes the <span class="xref" data-id="hedge">HEDGE FUND</span>’s raid-shadow ($3/raid to the money side) and <span class="xref" data-id="photo">THE BIG CON</span>’s seizure surveillance.</li></ul>',rel:['hedge','photo','jt'],evt:[]},
{id:'sat',img:'./static/the outback.jpg',name:['SATELLITE IMAGE','THE OUTBACK'],type:'WILD',shape:'sat',inc:1,cost:4,sub:'landscape · the dry country',short:'−1 Cortisol at the start of each of your turns (hiding out bush).',mech:'<ul><li><b>Every turn:</b> −1 Cortisol on payday, cheapest de-stress on the board.</li><li>Stacks: <span class="xref" data-id="rba">THE RESERVE BANK</span> −1, <span class="xref" data-id="gold">GOLD</span> −2 and even <span class="xref" data-id="rock">THE ROCK</span>’s COOK (−3 on use) — the whole pool of calm.</li><li>Sits hard next to the <span class="xref" data-id="made">MADE</span> graphic and <span class="xref" data-id="asics">ASICS</span>: calm and jogging neighbours.</li><li>The only pin in shape <code>sat</code>, drawn as a 170×90 satellite stretch.</li></ul>',rel:['rba','gold','rock','made','asics'],evt:[]},
{id:'watson',img:'./static/ceo of coal.png',name:['MARK WATSON','CEO OF COAL'],type:'WILD',shape:'photo',inc:0,cost:6,sub:'the face of the company',short:'+$2/turn while you also own COAL CORP HQ · exempts your COAL book from ACCC raids · voids the CEO PHOTO event entirely.',mech:'<ul><li><b>Payday:</b> +$2 per turn while you hold <span class="xref" data-id="coal">COAL CORP HQ</span> (CEO and face — same camp).</li><li><b>On the deck:</b> when <span class="erev" data-ev="ceophoto">CEO PHOTO LEAKS</span> runs and Watson’s owner also holds the HQ, the CEO fronts the cameras himself — the photos are dismissed as “old”: <span class="pos">no Cortisol, no dock pay, no press fee</span>, the whole event is voided.</li><li><b>ACCC immunity (the COAL book only):</b> holding Watson exempts the COAL industry book alone from concentration raids — other over-heavy books stay exposed.</li><li>Sits hard next to <span class="xref" data-id="coal">the HQ</span>, <span class="xref" data-id="train">the train</span>, <span class="xref" data-id="port">the docks</span>, <span class="xref" data-id="bhp">BHP</span> and the <span class="xref" data-id="golf">GOLF CLUB</span>.</li></ul>',rel:['coal','train','port','bhp','golf'],evt:[['ceophoto','voids the leak']]},
{id:'bessent',img:'./static/scott bessent.png',name:['SCOTT BESSENT','“BIG BESSENT”'],type:'WILD',shape:'photo',inc:1,cost:7,sub:'US Treasury · moves markets',short:'+$1 income per BANK node you own · +$3 when BIG BESSENT SPEAKS · +$2 at DAVOS.',mech:'<ul><li><b>Payday:</b> +$1 per <b>BANK</b> you hold — the Treasury bonhomie runs deep.</li><li><b>On the deck:</b> +$3 whenever <span class="erev" data-ev="besspeak">BIG BESSENT SPEAKS</span> (<i>he</i> is the speaker), +$2 whenever <span class="erev" data-ev="davos">DAVOS</span> runs (<b>a familiar face on the panel</b>).</li><li><b>Any hazard:</b> on <span class="erev" data-ev="bondrevolt">BONDMAGEDDON</span> he stays in the deal and takes a $2-per-bank bill like anyone holding banks — unless the <span class="xref" data-id="bond">BOND DESK</span> is in his hands, in which case he collects the toll instead.</li><li>FRONT of the BESSENT book with <span class="xref" data-id="bess">BREAKING</span> and the desk — more than two invites the regulators.</li></ul>',rel:['bond','bess','brad','wef','brad','tenyear'],evt:[['besspeak','+$3'],['davos','+$2']]},
{id:'chalmers',img:'./static/jim chalmers.png',name:['JIM CHALMERS','“THE JIM”'],type:'WILD',shape:'photo',inc:1,cost:8,sub:'the Treasurer',short:'+$1 income per REGULATOR node you own · +$2 whenever THE BUDGET is delivered.',mech:'<ul><li><b>Payday:</b> +$1 per <b>REGULATOR</b> you hold (the Treasurer’s friends — a chair at every table, like <span class="xref" data-id="westpac">WESTPAC</span>’s book).</li><li><b>On the deck:</b> on <span class="erev" data-ev="budget">THE JIM DELIVERS THE BUDGET</span> he pockets +$2; every <span class="erev" data-ev="rates">RATES DECISION</span> he ducks the $2 cost of money, and the rest of the table pays.</li><li><b>Front of the CHALMERS book:</b> he, <span class="xref" data-id="jim">THE JIM exclusive</span> and <span class="xref" data-id="herald">THE JIM REAPER</span> — more than two and the regulators read it too.</li><li>Pinned next to <span class="xref" data-id="gov">THE GOVERNMENT</span>, <span class="xref" data-id="tenyear">THE MASTER CHART</span> and <span class="xref" data-id="herald">Herald Sun</span>.</li></ul>',rel:['gov','jim','herald','westpac','tenyear'],evt:[['budget','+$2'],['rates','pays nothing']]},
{id:'albo',img:'./static/albo.png',name:['ANTHONY ALBANESE','THE PM'],type:'WILD',shape:'photo',inc:1,cost:8,sub:'the motorcade',short:'Rivals pay $2 tolls entering YOUR nodes · free BLOCKADE once per turn: wall off any node for a full rotation.',mech:'<ul><li><b>The motorcade closes the road:</b> any rival stepping into a node you own pays $2 (every other node charges $1; <span class="xref" data-id="bond007">JAMES BOND</span> pays nothing anywhere).</li><li><b>Action · BLOCKADE (free, once per turn):</b> wall off literally any node — rubble excepted — for one full rotation. Nobody walks in, NOBODY LANDS (the <span class="xref" data-id="qantas">jet</span> is turned away), and the wall does not excuse the blockade owner from standing outside it either.</li><li><b>On the deck:</b> +$1 while the budget is signed in the chamber.</li><li>Pinned next to <span class="xref" data-id="us">US BOND YIELDS</span>, <span class="xref" data-id="trump">DONALD TRUMP</span> and the <span class="xref" data-id="bullet">BULLET TRAIN</span> — cabinet row.</li></ul>',rel:['trump','bond007','qantas','bullet','us','gov'],evt:[['budget','+$1']]},
{id:'trump',img:'./static/trump.png',name:['DONALD TRUMP','TARIFF MAN'],type:'WILD',shape:'photo',inc:1,cost:7,sub:'the tweets move markets',short:'Unlocks THE TWEET ($2): pick a rival — they lose the greater of 3 Intel or 50% of their Intel (capped at their stack).',mech:'<ul><li><b>Action · THE TWEET ($2, once per turn):</b> choose any rival — they lose <span class="neg">min(ℓ, max(3, ⌈ℓ/2⌉))</span> Intel where ℓ is their stack. Short stacks (≤5) lose everything above… or everything. Stacks with whatever you can buy, but it is rarely less than your 3.</li><li><b>On the deck:</b> whenever <span class="erev" data-ev="tariffs">TRUMP TWEETS TARIFFS</span> is drawn, its owner personally chooses which chain gets the windfall — the oil chain (bigger book) or the coal chain. He pays the $1 tariff bill like anyone else who holds none of the winning pins.</li><li>Best bookmates: <span class="xref" data-id="oilgraph">OIL PRICE INCREASE</span> / <span class="xref" data-id="train">COAL TRAIN</span> etc. to ride the chosen chain’s +$3 payouts and <span class="xref" data-id="us">US BOND YIELDS</span> to bank the safe-haven bid.</li><li>Sits hard next to <span class="xref" data-id="albo">ALBANESE</span> and <span class="xref" data-id="oil">THE PIT</span> in the collage’s tariff corner.</li></ul>',rel:['albo','oil','oilgraph','train','us','gov'],evt:[['tariffs','picks the chain']]},
{id:'bullock',img:'./static/michelle bullock.png',name:['MICHELE BULLOCK','RBA GOVERNOR'],type:'WILD',shape:'photo',inc:1,cost:7,sub:'she decides the cash rate',short:'Rate events never charge you · +1 Intel each turn (the Governor briefs you).',mech:'<ul><li><b>Every turn:</b> +1 Intel on payday.</li><li><b>On the deck:</b> when <span class="erev" data-ev="rates">THE RBA CASH-RATE DECISION</span> lands, the Governor takes the calls — her owner pays nothing while the rest of the table feeds $2 to the void (same free pass as the <span class="xref" data-id="rba">RBA</span> itself).</li><li><b>The MONETARY book:</b> she, the RBA, <span class="xref" data-id="cash">CASH-RATE CHART</span>, <span class="xref" data-id="infl">INFLATION</span> and <span class="xref" data-id="mpc">THE COMPETITION</span> — the one industry the <span class="xref" data-id="asic">ASIC</span> investigates as market manipulation.</li><li>Rate-event toll refunds pair nicely with <span class="xref" data-id="cash">the cash chart</span> and <span class="xref" data-id="jim">THE JIM</span>/<span class="xref" data-id="bess">BIG BESSENT</span> reaction sales.</li></ul>',rel:['rba','cash','infl','mpc','asic','jim','bess'],evt:[['rates','pays nothing']]},
{id:'bond007',img:'./static/james bond.png',name:['JAMES BOND','CITIBANK · 007'],type:'WILD',shape:'photo',inc:1,cost:6,sub:'banker. sort of.',short:'You pay NO tolls anywhere · +$2 whenever QUIKSTOP ROBBERY runs.',mech:'<ul><li><b>Credentials:</b> walking into any rival node costs $0 (normally $1, $2 with <span class="xref" data-id="albo">ALBANESE</span>). Blockades still stop him — a licence to kill, not a battering ram.</li><li><b>On the deck:</b> when <span class="erev" data-ev="quikrob">QUIKSTOP ROBBERY</span> is drawn, +$2 — he was there in disguise (allegedly).</li><li>The payroll legend runs through <span class="xref" data-id="citi">CITI TOWER</span> (007 is at that bank) and next door to <span class="xref" data-id="quik">QUIKSTOP</span> — the shop he may or may not have knocked over.</li></ul>',rel:['citi','albo','quik','back'],evt:[['quikrob','+$2']]},
{id:'rock',img:'./static/the rock.gif',name:['THE ROCK','CAN SMELL IT'],type:'WILD',shape:'photo',inc:1,cost:7,sub:'final boss energy',short:'Unlocks COOK THE BOOKS ($3): −3 Cortisol · +$1 income per DIFFERENT node type you hold.',mech:'<ul><li><b>Payday:</b> +$1 per <b>different node type</b> you hold (7 base types + 🌍 Geography DLC pins all count as their own type slices — a full win-set pays $7 on top).</li><li><b>Action · COOK THE BOOKS ($3, once per turn):</b> −3 Cortisol — the calm of a man who knows exactly where the bodies lie. Usable as your action or mid-walk via <span class="xref" data-id="back">BACKROOM DEALS</span> (−2 steps).</li><li><b>On the deck:</b> when <span class="erev" data-ev="rockcooks">THE ROCK COOKS</span> runs and he’s unowned, nobody benefits — the books stay raw.</li><li>A bodyguard for <span class="xref" data-id="coal">COAL CORP HQ</span>’s book and an all-type player’s best payday boost.</li></ul>',rel:['coal','back','made','sat','rba'],evt:[['rockcooks','+$3 · −1 Cortisol']]},
{id:'brad',img:'./static/brad pitt.png',name:['BRAD PITT','“THE BIG SHORT”'],type:'WILD',shape:'photo',inc:1,cost:5,sub:'explained it in the movie',short:'+$2 whenever a BOND-related event runs (+$2 at the screening too).',mech:'<ul><li><b>On the deck:</b> +$2 whenever <span class="erev" data-ev="bondrevolt">BONDMAGEDDON</span> runs, +$2 whenever <span class="erev" data-ev="besspeak">BIG BESSENT SPEAKS</span>, and +$2 when <span class="erev" data-ev="bigscreen">THE BIG SHORT SCREENING</span> plays — never mind that the screening IS him and <span class="xref" data-id="bigshort">THE CINEMA</span> banks $3.</li><li>Pairs cheaply and well: $5 pin that rides three different event triggers, close to <span class="xref" data-id="wef">THE WEF</span> and <span class="xref" data-id="bigshort">the screening crew</span> on the collage.</li><li>He had it explained — the <span class="xref" data-id="bess">“BIG BESSENT” BREAKING</span> graphic moves in the same circles.</li></ul>',rel:['bigshort','wef','bess','bond','tenyear'],evt:[['bondrevolt','+$2'],['besspeak','+$2'],['bigscreen','+$2']]},
{id:'jt',img:'./static/jt portal.png',name:['JTPORTAL','QUITE FRANKLY'],type:'WILD',shape:'photo',inc:1,cost:9,sub:'the legend of the board',short:'+1 Intel each turn · the next Market Event is shown to you at the start of your turn · ONCE per game, cancel an event as it is revealed.',mech:'<ul><li><b>Every turn:</b> +1 Intel, and a briefing — the <b>next</b> market event is shown to you before you plan your turn. Combined with <span class="xref" data-id="term">THE TERMINAL</span>/<span class="xref" data-id="iface">INTERFACE</span> peeks and the base 2 💳 <b>SPY ON THE DECK</b> free action, you see further than the table.</li><li><b>ONCE PER GAME:</b> as an event is revealed you are privately asked “JTPortal intervenes?” — cancel it and the card <span class="pos">never runs at all</span> (no event income, no event Cortisol, no toll collection, and <span class="xref" data-id="toktimer">TOKTIMER</span>’s reveal intel is skipped too).</li><li><b>The JTPORTAL book:</b> him, <span class="xref" data-id="press">THE PRESS ROOM</span> and <span class="xref" data-id="iface">THE INTERFACE</span> — hold more than two and the <span class="xref" data-id="accc">ACCC</span> investigates the narrative.</li><li><b>On the deck:</b> +1 Intel whenever <span class="erev" data-ev="mpcfinals">MPC FINALS</span> judges (he is rumoured to be on the panel); <span class="erev" data-ev="tapes">THE TAPES</span> don’t touch him — JTPortal keeps backups.</li></ul>',rel:['press','iface','term','toktimer','insider','whistle'],evt:[['mpcfinals','+1 Intel'],['tapes','keeps backups']]},
{id:'made',img:'./static/made logo.png',name:['MADE','(???)'],type:'WILD',shape:'made',inc:2,cost:7,sub:'the purple graphic',short:'Start of every turn: 33% chance it pays out — +$10 and +1 Intel to its owner. Skims 15% of cash from rich rivals.',mech:'<ul><li><b>Every turn starts:</b> flip a coin with 2 faces of 6 — on a hit, the owner banks <b>+$10 and +1 Intel</b>. The important part: every OTHER player with <b>more than two nodes and at least $50</b> hands over 15% of their cash.</li><li><b>Flat price forever:</b> takeovers of MADE never inflate — always list (like <span class="xref" data-id="rba">the RBA</span> and <span class="xref" data-id="qantas">QANTAS</span>).</li><li><b>On the deck:</b> <span class="erev" data-ev="madeout">MADE PAYS OUT… PROBABLY</span> — a second 1-in-3 roll mid-deck, piggybacking the same payout.</li><li><b>Force the divestment:</b> any rival holding $7 plus 5 Intel can yank MADE away — the purple graphic moves to them (former owner banks $7 compensation, and the ex-owner starts +1 Cortisol for the trouble).</li><li>Nobody knows what the graphic <i>is</i>. NOBODY.</li></ul>',rel:['rba','qantas','photo','sat','news'],evt:[['madeout','1-in-3 odds']]},
{id:'asics',img:'./static/running shoe.jpg',name:['THE RUNNING SHOE','ASICS'],type:'WILD',shape:'photo',inc:1,cost:3,sub:'circled in red · why is this here',short:'+1 movement step each turn · stand here to JOG: free −1 Cortisol.',mech:'<ul><li><b>Every turn:</b> +1 movement step (you are always jogging) — with the rail <i>and</i> <span class="xref" data-id="coal">COAL HQ</span> the full stack reaches 6 steps before favours and <span class="xref" data-id="f1">SLIPSTREAM</span>.</li><li><b>Action · JOG (free, once per turn):</b> standing on your shoe, burn −1 Cortisol per action phase. Can trigger <span class="xref" data-id="back">BACKROOM</span> affordably (it’s free!!) — just be on the shoe.</li><li>The cheapest pin on the board at $3 — an early-game must-have next to <span class="xref" data-id="market">MARKETPLACE</span> and the subway run below the school.</li><li>Neighbors: <span class="xref" data-id="sat">THE OUTBACK</span> and <span class="xref" data-id="sisy">SISYPHUS</span>, in the way of the groove — the calm pins.</li></ul>',rel:['coal','back','sat','sisy','market'],evt:[]},
{id:'toktimer',img:'./static/toktimer.png',name:['TOKTIMER'],type:'WILD',shape:'photo',inc:1,cost:5,sub:'the clock is running',short:'+1 Intel whenever a Market Event is revealed.',mech:'<ul><li><b>On every reveal:</b> +1 Intel — time is information, and the deck turns <span class="pos">24 cards</span> before reshuffling.</li><li>Canceled events (<span class="xref" data-id="jt">JTPORTAL</span>) don’t reveal anything — the clock doesn’t tick for a card that “never happened”.</li><li>Pinned beside <span class="xref" data-id="iface">THE MARKET INTERFACE</span> and <span class="xref" data-id="whistle">THE WHISTLEBLOWER</span> down in the east wing.</li></ul>',rel:['jt','iface','whistle'],evt:[]},
/* ── 🌍 the geography dlc ── */
{id:'geo_missile',img:'./static/GeographyDLC/nk_missile.jpg',name:['MISSILE COMMAND'],type:'REGULATOR',shape:'photo',icon:'🚀',inc:0,cost:8,sub:'strategic assets · keys under the desk',geo:1,short:'Unlocks LAUNCH A MISSILE ($4 + 1 Intel, once per turn): strike any rival node that still stands — on-site from the silo, or from anywhere with KIM JONG UN.',mech:'<ul><li><b>The launch:</b> fire from the silo itself (action or mid-move — a mid-move launch ends the walk; the action phase still follows) — or from <span class="neg">anywhere</span> if you hold <span class="xref" data-id="geo_kim">KIM JONG UN</span>. Costs $4 <i>and</i> 1 Intel, once per turn. <span class="xref" data-id="geo_shahed">THE IRANIAN SHAHED DRONE</span> is a second launch site with the exact same price and rules — and <b>nobody may own both launchers</b>.</li><li><b>The strike:</b> an owned target is <span class="neg">expropriated with no payout</span>; either way the hit node becomes <b>rubble</b> — no income, no seizing. Your own pins cannot be struck (you can\'t nuke your portfolio). <span class="xref" data-id="geo_pillars">PILLARS</span> no longer block anything: the ESG laminates themselves are valid targets, and a Pillars owner\'s holdings are struck like anyone else\'s.</li><li><b>Regulator revenge:</b> put a warhead into <b>any REGULATOR</b> — this silo, the drone, <span class="xref" data-id="accc">ACCC</span>, <span class="xref" data-id="gov">the Government</span>… — and an investigation opens that lands on <i>your</i> NEXT turn: a 50/50 indictment (<b>ASIC or ACCC</b>, full raid on conviction) and <b>+1 Cortisol</b> whether it lands or not.</li><li><b>Rebuilding:</b> stand on rubble in your action phase and pay the node’s list price — it returns <b>unowned</b> and buyable from next turn (the rebuild is an action of its own). <span class="xref" data-id="geo_pyothotel">THE PYONGYANG HOTEL</span>’s owner banks +$2 in kickbacks on every rebuild.</li><li><b>Seize:</b> the command pays <span class="neg">$0 income</span> — control, not cash. It counts as a REGULATOR: <span class="xref" data-id="westpac">WESTPAC</span>’s locker-book, and a third REGULATOR opens the usual 33% concentration probe.</li></ul>',rel:['geo_shahed','geo_kim','geo_pillars','geo_pyothotel','geo_tuvalu','westpac','rba'],evt:[]},
{id:'geo_shahed',img:'./static/GeographyDLC/shahed drone.webp',name:['IRANIAN','SHAHED DRONE'],type:'REGULATOR',shape:'photo',icon:'🛩️',inc:0,cost:8,sub:'one-way delivery · disposable diplomacy',geo:1,short:'A second missile launcher ($4 + 1 Intel, once per turn) — fire from the drone, or from anywhere with KIM JONG UN. Nobody may own both launchers.',mech:'<ul><li><b>Same launcher rules:</b> identical to <span class="xref" data-id="geo_missile">MISSILE COMMAND</span> — LAUNCH A MISSILE for <b>$4 + 1 Intel, once per turn</b>: stand on the drone you own to fire, or own <span class="xref" data-id="geo_kim">KIM JONG UN</span> to arm it from anywhere. A mid-move launch ends the walk; the action phase still follows.</li><li><b>Mutually exclusive:</b> seize/own either the silo or the drone — <b>never both</b> (the engine blocks the second buy outright). Two rivals pairing both sites is fine, of course; take the other one off the table first.</li><li><b>The strike:</b> owned targets are <span class="neg">expropriated with no payout</span>, any hit node becomes <b>rubble</b>; your own pins are immune. The <span class="xref" data-id="geo_pillars">ESG PILLARS</span> are strikable like everything else — one of the pillars is cardboard, after all.</li><li><b>Tuvalu remembers:</b> if your target is <span class="xref" data-id="geo_tuvalu">THE ISLAND</span>, the warhead flies home and the <i>drone</i> blows up instead of the silo — your own random holding takes the hit.</li><li><b>Dealing:</b> a HIGH-VALUED GEO seed like (nearly) all of its set — the engine spreads the launch sites far from Quikstop and far from each other.</li></ul>',rel:['geo_missile','geo_kim','geo_venice','geo_pillars','geo_tuvalu','accc'],evt:[]},
{id:'geo_wonsan',img:'./static/GeographyDLC/nk_wonsanresort.jpg',name:['WONSAN','RESORT'],type:'WILD',shape:'photo',icon:'🏖️',inc:2,cost:5,sub:'the beach town · sanctioned paradise',geo:1,short:'Stand here (once owned) for BEACH DAY: free, once per turn, −2 Cortisol.',mech:'<ul><li><b>Beach Day:</b> from the sand, as your action (or mid-walk through <span class="xref" data-id="back">BACKROOM DEALS</span>), wash away −2 Cortisol — free, once per turn. Better relief than the <span class="xref" data-id="asics">JOG</span>, costlier in real estate.</li><li>Sanctioned paradise prices: a $5 pin with income 2 and the calmest stay on the board — the sand is quiet, the waves are loud, nobody is watching.</li><li>Wired by red threads to the <span class="xref" data-id="geo_missile">silo</span>, <span class="xref" data-id="geo_pyothotel">the hotel</span> and <span class="xref" data-id="geo_pyoncity">the capital</span> — but the dealing engine scatters the North Korea pins wide apart: paradise is never next door.</li></ul>',rel:['back','asics','rba','geo_pyoncity','geo_pyothotel','geo_missile'],evt:[]},
{id:'geo_pyoncity',img:'./static/GeographyDLC/nk_pyongyangcity.webp',name:['PYONGYANG','CITY'],type:'BANK',shape:'photo',icon:'🌆',inc:2,cost:6,sub:'the capital · show windows, all lit',geo:1,short:'+$1 income per 🌍 GEOGRAPHY DLC node you own — the capital collects tribute.',mech:'<ul><li><b>Payday:</b> +$1 for every DLC pin you hold — and it <b>counts $0-income pins too</b> (the silo, <span class="xref" data-id="geo_kim">KIM</span>): total tribute, not usefulness.</li><li><b>Also a proper BANK:</b> counts for <span class="xref" data-id="commbank">COMMONWEALTH BANK</span>’s synergy, bleeds $1 in <span class="hot">PANIC</span>, and pays tolls like any node on the board.</li><li><b>Northern locus:</b> connected by red thread to <span class="xref" data-id="geo_missile">the silo</span>, <span class="xref" data-id="geo_pyothotel">the hotel</span>, <span class="xref" data-id="geo_wonsan">the beach</span> and <span class="xref" data-id="geo_kim">KIM</span> — but the pins are <b>dealt wide apart</b> (the engine deliberately un-clusters the hermit kingdom): take the capital and bring walking shoes, or plan a flight.</li><li>Counted by <span class="xref" data-id="citi">CITI</span> or <span class="xref" data-id="bond">the desk</span> like any other bank.</li></ul>',rel:['commbank','citi','bond','geo_missile','geo_kim','geo_wonsan','geo_pyothotel'],evt:[]},
{id:'geo_pyothotel',img:'./static/GeographyDLC/nk_pyongyanghotel.jpg',name:['PYONGYANG','HOTEL'],type:'CORPORATE',shape:'photo',icon:'🏨',inc:2,cost:8,sub:'106 floors · 47 in use',geo:1,short:'Gain $2 whenever ANY rubble node is REBUILT — construction kickbacks, allegedly.',mech:'<ul><li><b>Rebuild kickbacks:</b> the hotelier banks +$2 on every single rebuild on the board — rubble from missiles anywhere, including your own silo’s backblast.</li><li><b>But who rebuilds:</b> rebuilds are the <span class="xref" data-id="geo_missile">MISSILE COMMAND</span> shadow economy. In a missile-happy lobby this is one of the strongest passive earners on the board.</li><li><b>Watch your own door:</b> every strike makes <i>someone</i> rebuild for you — and nothing more shields your own buildings: no pin on the board is <span class="xref" data-id="geo_pillars">PILLARS</span>-protected any more, ESG laminates included, so every rebuild you bank can be one of your own doors.</li><li>Counted by <span class="xref" data-id="citi">CITI TOWER</span>; a third CORPORATE opens a probe for a >2 book.</li></ul>',rel:['geo_missile','geo_pyoncity','geo_boeing','geo_wonsan','geo_pillars','citi'],evt:[]},
{id:'geo_boeing',img:'./static/GeographyDLC/geo_boeing.jpg',name:['THE CORPORATE','BOEING'],type:'CORPORATE',shape:'photo',icon:'🛩️',inc:2,cost:7,sub:'white tail · no livery · no paperwork',geo:1,short:'Unlocks SHUT DOWN QANTAS ($4, once per turn): the kangaroo is grounded for two full turns.',mech:'<ul><li><b>Action · SHUT DOWN QANTAS ($4, once per turn):</b> park the white tail on the runway — for two full turns nobody can <b>fly</b> the jet, nobody can <b>walk into</b> the pin, and the kangaroo’s owner collects <span class="neg">no income from it at all</span>.</li><li><b>Credential:</b> you cannot ground QANTAS if you own it yourself.</li><li><b>Why it’s expensive:</b> the jet answers every movement puzzle on the board — grounding it can cost a whole strategy arc, and <span class="xref" data-id="geo_missile">MISSILE COMMAND</span> or the <span class="xref" data-id="geo_shahed">SHAHED DRONE</span> can finish the job instead.</li><li>Also a <b>CORPORATE</b>: counted by <span class="xref" data-id="citi">CITI TOWER</span>’s payroll; a third CORPORATE opens a probe for a >2 book.</li></ul>',rel:['qantas','citi','coal','geo_missile','geo_pyothotel','accc'],evt:[]},
{id:'geo_scs',img:'./static/GeographyDLC/geo_southchinasea.jpg',name:['THE SOUTH','CHINA SEA'],type:'COMMODITY',shape:'photo',icon:'🌊',inc:4,cost:9,sub:'disputed waters · freedom of navigation',geo:1,short:'Unlocks TRIGGER AN OIL CRASH ($3, once per turn): PANIC mood, and every player pays $2 per oil node they own.',mech:'<ul><li><b>Action · TRIGGER AN OIL CRASH ($3, once per turn):</b> the sea lanes close — the mood goes <span class="hot">PANIC</span> (banks bleed −$1/turn) and <span class="neg">every player</span> holding an oil pin pays <b>$2 per oil node</b> straight to the void: the five-pin OIL book (<span class="xref" data-id="oil">THE PIT</span>, <span class="xref" data-id="oilgraph">OIL GRAPH</span>, <span class="xref" data-id="barrels">BARRELS</span>, <span class="xref" data-id="tanker">TANKERS</span>, <span class="xref" data-id="petronas">PETRONAS</span>). <span class="xref" data-id="geo_pillars">PILLARS</span>-protected players ride it out.</li><li><span class="neg">Careful:</span> the crash targets <i>oil holders</i> — if you also own oil pins, you bill yourself too. Sea power doesn’t discriminate.</li><li><b>Payday:</b> $4/turn in its own right — the biggest DLC pin.</li><li><b>Deals:</b> situated with <span class="xref" data-id="geo_venice">VENICE</span> and <span class="xref" data-id="geo_tuvalu">TUVALU</span> in the wet corner; counted by <span class="xref" data-id="forklift">THE FORKLIFT</span> and the COMMODITY probe.</li></ul>',rel:['geo_pillars','geo_venice','geo_tuvalu','oil','oilgraph','barrels','tanker','petronas','forklift'],evt:[]},
{id:'geo_stage5',img:'./static/GeographyDLC/geo_stage5decline.png',name:['STAGE 5','DECLINE'],type:'CHART',shape:'chart',spark:'down',inc:1,cost:4,sub:'imported uranium · charcoal · decay',geo:1,short:'Unlocks CALL STAGE 5 (2 Intel, once per turn): the current richest player (not you) makes NO income on their next turn.',mech:'<ul><li><b>Action · CALL STAGE 5 (2 Intel, once per turn):</b> pick the table — the <b>richest other player</b> is called into decline: next turn they collect <span class="neg">nothing at all</span>. No salary, no node income, no synergies. It clears after their skipped payday.</li><li><b>ESG refusals:</b> a player holding <span class="xref" data-id="geo_pillars">THE PILLARS</span> cannot be called — decline works on a rich table, not a green one.</li><li><b>Payday:</b> $1/turn — this chart is a rare one, drawn <code>down</code>, the only declining curve on the wall.</li><li><b>Best with:</b> <span class="xref" data-id="whistle">intel</span> income to fund repeated calls, and the <span class="xref" data-id="ib">IB DIPLOMA</span> makes its own base $2. <span class="xref" data-id="nab">NAB</span> also discounts this chart like any other.</li></ul>',rel:['geo_pillars','whistle','ib','nab','tenyear'],evt:[]},
{id:'geo_pillars',img:'./static/GeographyDLC/geo_pillars.jpg',name:['PILLARS OF','SUSTAINABILITY'],type:'REGULATOR',shape:'photo',icon:'🧱',inc:1,cost:6,sub:'ESG-laminated · one pillar is cardboard',geo:1,short:'ESG SHIELD: −1 Cortisol each turn · you pay nothing on OIL CRASHES · Stage 5 can’t call you — but the laminates themselves can now be missile-struck, and Overtourism reaches your holdings.',mech:'<ul><li><b>The shield, nerfed:</b> the engine stripped the old full immunity — the Pillars themselves are now valid missile targets, and <span class="xref" data-id="geo_venice">OVERTOURISM</span> marks your holdings like anyone else\'s. What remains: <b>−1 Cortisol every payday</b>, you pay <span class="pos">nothing</span> when <span class="xref" data-id="geo_scs">the sea closes</span>, and <span class="xref" data-id="geo_stage5">STAGE 5</span> can\'t call you into decline.</li><li><b>Flat price forever:</b> hostile takeovers of the Pillars <b>never inflate</b> — always the $6 list (like <span class="xref" data-id="rba">the RBA</span>, <span class="xref" data-id="made">MADE</span> and <span class="xref" data-id="qantas">QANTAS</span>). Cheap to re-take; easy to keep losing.</li><li><b>Even your missiles drip green:</b> if the shield owner launches at <span class="xref" data-id="geo_tuvalu">TUVALU</span> themselves, the reflected warhead hits one of <i>their</i> own pins at random — no green pass on the reflection.</li><li><b>It is a REGULATOR:</b> strikes against the laminates open the same regulator-revenge probe as any other regulator pin; it counts for <span class="xref" data-id="westpac">WESTPAC</span>’s locker-book and the 33% concentration probe.</li></ul>',rel:['geo_missile','geo_shahed','geo_scs','geo_stage5','geo_venice','westpac','rba'],evt:[]},
{id:'geo_venice',img:'./static/GeographyDLC/geo_venice.jpg',name:['VENICE','DI CCTV'],type:'MEDIA',shape:'photo',inc:3,cost:8,sub:'la serenissima · sella aperta',geo:1,short:'Stand here for GONDOLA THERAPY (free, once/turn, −1 Cortisol) — or send OVERTOURISM ($2, once/turn) to mark a rival node for one full table rotation.',mech:'<ul><li><b>GONDOLA THERAPY (free, once per turn, on-site):</b> −1 Cortisol. Or — <b>OVERTOURISM ($2, once per turn, action phase, either/or that turn):</b> mark <b>any rival-owned node that still stands — ESG holdings included</b>. The mark lives for <b>one full table rotation</b>: the marked node\'s owner takes <span class="hot">+1 Cortisol</span> at the start of each of their turns inside that window.</li><li><b>The mark expires:</b> it clears when the rotation finishes, Venice changes hands, the marked pin changes hands, or the pinned node is struck into rubble — cruise ships don\'t chase new owners.</li><li><b>Nice bookmaking:</b> <span class="xref" data-id="photo">THE BIG CON</span> and <span class="xref" data-id="herald">THE JIM REAPER</span> pay Intel for Cortisol — a marked rival keeps feeding them.</li><li>Media income $3/turn + FRENZY mood days pay the gallery.</li></ul>',rel:['geo_pillars','photo','herald','geo_scs','insider'],evt:[]},
{id:'geo_tuvalu',img:'./static/GeographyDLC/geo_tuvalu.png',name:['TUVALU','.TV'],type:'WILD',shape:'photo',icon:'🏝️',inc:2,cost:5,sub:'the first country you get free',geo:1,short:'THE JOIN IS FREE: the first player to arrive (walked or flown) simply owns it — no action, no cost, no Cortisol.',mech:'<ul><li><b>Free claim:</b> the first player to set foot here — walked <i>or</i> flown in — owns it instantly. After that, normal rules apply (rubble still blocks the join).</li><li><b>The island refuses missiles:</b> any warhead aimed here <b>reflects home</b> — the launcher that actually fired (the <span class="xref" data-id="geo_missile">MISSILE COMMAND</span> silo or the <span class="xref" data-id="geo_shahed">SHAHED DRONE</span> alike) is destroyed: rubble, no refund. On top of the $4 + 1 Intel they already paid, one <b>random node they own</b> takes the reflected hit — ESG holdings included, no green pass.</li><li><b>The most peaceful $5 pin:</b> $2/turn income and a free arrival ANY table wants for their win-set… so jealously hold the moat.</li><li><b>Deals:</b> wet corner with <span class="xref" data-id="geo_scs">THE SEA</span> and <span class="xref" data-id="geo_venice">VENICE</span> — a <span class="xref" data-id="geo_pyoncity">capital-city</span> neighbour would amount to a walk-in.</li></ul>',rel:['geo_missile','geo_pillars','geo_scs','geo_venice','geo_pyoncity'],evt:[]},
{id:'geo_kim',img:'./static/GeographyDLC/nk_kimjongun.png',name:['KIM JONG','UN'],type:'WILD',shape:'photo',inc:0,cost:6,sub:'the man himself · nothing is happening',geo:1,short:'+1 Intel at the start of each of your turns · owning him exempts you from either launcher’s on-site rule — the keys work from anywhere.',mech:'<ul><li><b>Every turn:</b> +1 Intel on payday — the Supreme Leader briefs you.</li><li><b>Nothing is happening:</b> his $0 income is correct; he is worth holding purely for the <b>range exemption</b> — fire <span class="xref" data-id="geo_missile">THE SILO</span> or the <span class="xref" data-id="geo_shahed">SHAHED DRONE</span> from wherever you stand, no detour to either launch site.</li><li><b>Scattered:</b> the engine deliberately un-clusters the hermit kingdom — KIM is dealt wide across the board, so the intel drip is the only thing local about him.</li><li><b>Type:</b> a WILD polaroid — counts toward nothing except his own two tricks… and whatever <span class="xref" data-id="rock">THE ROCK</span> smells.</li></ul>',rel:['geo_missile','geo_shahed','geo_pyoncity','rock','whistle'],evt:[]},
];
const EVENTS=[
{id:'oilspike',icon:'🛢️',title:'OIL SPIKES — WTI +12%',mood:'BOOM',tag:'crude goes vertical',pay:['<b>OIL:</b> <span class="xref" data-id="oil">CRUDE OIL PIT</span> +$6 · <span class="xref" data-id="oilgraph">OIL PRICE INCREASE</span> +$2 · <span class="xref" data-id="tanker">TANKER FLEET</span> +$3 · <span class="xref" data-id="petronas">PETRONAS</span> +$3 · <span class="xref" data-id="barrels">BLUE OIL BARRELS</span> +$2.','<b>Quikstop desk:</b> every rival pays the <span class="xref" data-id="quik">QUIKSTOP</span> owner $1 at the pump (unowned, the money burns at the void).']},
{id:'coalrush',icon:'🚃',title:'COAL RUSH',mood:'BOOM',tag:'everything on rails makes money',pay:['<b>COAL:</b> <span class="xref" data-id="port">COAL TERMINAL</span> +$4 · <span class="xref" data-id="bhp">BHP</span> +$3 · <span class="xref" data-id="tanker">TANKER FLEET</span> +$3 · <span class="xref" data-id="coal">COAL CORP HQ</span> +$2 · <span class="xref" data-id="train">THE COAL TRAIN</span> +$2 · <span class="xref" data-id="forklift">THE FORKLIFT</span> +$1.']},
{id:'rates',icon:'🏛️',title:'RBA CASH-RATE DECISION',mood:'CALM',tag:'money gets expensive — for everyone but the insiders',pay:['<b>SUBSIDY:</b> every player pays <span class="pos">$2 to the void</span> — <span class="xref" data-id="rba">THE RESERVE BANK</span> and <span class="xref" data-id="bullock">MICHELE BULLOCK</span> owners pay <b>nothing</b>.','<b>Insiders:</b> <span class="xref" data-id="cash">CASH-RATE CHART</span> +$2 · <span class="xref" data-id="jim">“THE JIM…”</span> +$2 · <span class="xref" data-id="bess">“BIG BESSENT”</span> +$2 · <span class="xref" data-id="herald">HERALD SUN</span> +$2.']},
{id:'bondrevolt',icon:'💥',title:'BONDMAGEDDON',mood:'PANIC',tag:'“the collapse of the world’s safest investment”',pay:['<b>The revolt eats the book:</b> every player holding a BANK pays <span class="neg">$2 per bank held</span> — straight to the <span class="xref" data-id="bond">BOND DESK</span> owner’s pocket (no desk, no till: the vault keeps it).','<b>Safe havens:</b> <span class="xref" data-id="japan">JAPAN BOND YIELDS</span> +$3 · <span class="xref" data-id="us">US</span>/<span class="xref" data-id="uk">UK</span>/<span class="xref" data-id="aus">AUS</span> BOND YIELDS +$1 · <span class="xref" data-id="tenyear">THE 10-YEAR MASTER</span> +$2.','<b>Narrative:</b> <span class="xref" data-id="bigshort">THE BIG SHORT</span> +$3 · <span class="xref" data-id="bess">“BIG BESSENT”</span> +$2 · <span class="xref" data-id="brad">BRAD PITT</span> +$2 · <span class="xref" data-id="leak">THE LEAK</span> +$2.']},
{id:'ceophoto',icon:'📸',title:'CEO PHOTO LEAKS — COAL CORP',mood:'FRENZY',tag:'Mark Watson, photographed exactly where he should not have been',pay:['<b>Unowned HQ:</b> nothing happens — Watson denies everything to an empty room.','<b>Watson void:</b> if the <span class="xref" data-id="coal">COAL CORP HQ</span> owner also holds <span class="xref" data-id="watson">MARK WATSON</span>, the photos are dismissed as “old” — no Cortisol, no dock pay, no press fee. The whole event voids.','<b>The docks bank first:</b> an HQ owner holding <span class="xref" data-id="port">THE DOCKS</span> banks <span class="pos">+$5</span> (the coal shipped before the news broke) — that pay <i>stacks</i> with whatever the mugshot does next.','<b>The press saves him:</b> if the HQ owner also holds <span class="xref" data-id="press">THE PRESS ROOM</span> or <span class="xref" data-id="fox">FOX BUSINESS</span>, the fine is replaced by <span class="pos">+$3 (a $3 cover fee)</span> — the only route out of the mugshot (still collects dock pay on top).','<b>Otherwise:</b> the HQ owner takes <span class="neg">+3 Cortisol</span> on top of any dock pay — the photos run on every front page.']},
{id:'tariffs',icon:'🦅',title:'TRUMP TWEETS TARIFFS',mood:'PANIC',tag:'ALL CAPS. Exclamation points. Markets swan-dive.',pay:['<b>The chain:</b> the <span class="xref" data-id="trump">DONALD TRUMP</span> owner picks which chain gets the windfall (random 50/50 when unowned): <b>OIL chain</b> — <span class="xref" data-id="oil">PIT</span>, <span class="xref" data-id="oilgraph">GRAPH</span>, <span class="xref" data-id="barrels">BARRELS</span>, <span class="xref" data-id="tanker">TANKERS</span>, <span class="xref" data-id="petronas">PETRONAS</span> — or <b>COAL chain</b> — <span class="xref" data-id="coal">HQ</span>, <span class="xref" data-id="train">TRAIN</span>, <span class="xref" data-id="port">DOCKS</span>, <span class="xref" data-id="watson">WATSON</span>, <span class="xref" data-id="forklift">FORKLIFT</span>, <span class="xref" data-id="bhp">BHP</span>. Every holder in the chain banks <span class="pos">+$3 each</span>.','<b>Safe haven:</b> <span class="xref" data-id="us">US BOND YIELDS</span> +$2 extra.','<b>The bill:</b> every player who is not a winner pays <span class="neg">$1 to the void</span>.']},
{id:'besspeak',icon:'🎤',title:'BIG BESSENT SPEAKS',mood:'CALM',tag:'markets listen',pay:['<b>On the panel:</b> <span class="xref" data-id="bessent">SCOTT BESSENT</span> +$3 · <span class="xref" data-id="bond">THE BOND DESK</span> +$2 · <span class="xref" data-id="tenyear">THE 10-YEAR MASTER</span> +$2 · <span class="xref" data-id="brad">BRAD PITT</span> +$2.']},
{id:'budget',icon:'📰',title:'THE JIM DELIVERS THE BUDGET',mood:'CALM',tag:'the Jim reads numbers to a sleepy chamber',pay:['<b>The desk:</b> <span class="xref" data-id="chalmers">JIM CHALMERS</span> +$2 · <span class="xref" data-id="jim">“THE JIM…”</span> +$2 · <span class="xref" data-id="herald">HERALD SUN</span> +$2 · <span class="xref" data-id="albo">ANTHONY ALBANESE</span> +$1 (he signs it).','<b>Return to sender:</b> everyone else pays <span class="neg">$1 to the void</span> (taxes).']},
{id:'mpcfinals',icon:'🏆',title:'MONETARY POLICY COMPETITION FINALS',mood:'BOOM',tag:'JTPortal is rumoured to be judging',pay:['<b>The champions’ purse:</b> <span class="xref" data-id="mpc">THE AUSTRALIAN MONETARY POLICY COMPETITION</span> owner banks <span class="pos">+$4 and +1 Intel</span> · <span class="xref" data-id="school">ST ANDREW’S</span> +$2 (the school places) · <span class="xref" data-id="ib">THE IB DIPLOMA</span> +$2 (the cohort delivers) · <span class="xref" data-id="jt">JTPORTAL</span> +1 Intel (the judged submission).']},
{id:'sisyroll',icon:'🪨',title:'THE BOULDER ROLLS BACK DOWN',mood:'CALM',tag:'the biggest players feel it most',pay:['<b>Gravity:</b> every player tied for the <b>most nodes on the board</b> pays <span class="neg">$2 to the void</span> — <span class="xref" data-id="sisy">THE SISYPHUS BOULDER</span>’s owner is always immune (they’re used to this).']},
{id:'goldrush',icon:'🪙',title:'GOLD RUSH',mood:'BOOM',tag:'paper money suddenly looks like a rumour',pay:['<b>Gleam:</b> <span class="xref" data-id="gold">THE GOLD-COLOURED COINS</span> +$5 · <span class="xref" data-id="bhp">BHP</span> +$3 (ore prices sneak up with the gold).','<b>Inflation bites:</b> every other player pays <span class="neg">$1 to the void</span>.']},

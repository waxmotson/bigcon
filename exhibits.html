const EVBY={};EVENTS.forEach(e=>EVBY[e.id]=e);
const HI_SET=new Set('qantas rba oil gold sat asics rock press fox sisy made bullock jt mpc whistle term bond hedge petronas geo_missile geo_shahed geo_scs geo_pyothotel geo_boeing geo_pillars geo_kim geo_wonsan geo_venice geo_pyoncity geo_stage5'.split(' '));

/* ================= build the sections ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let showGeo=true,onlyTypes=new Set(),query='';
/* pin-art proportions mirrored from the engine: each shape draws its image into a
   (w−10) × (h−22) box (the pin's label bar takes the rest), sliced to cover — so
   every tile crops exactly like the exhibit's artwork does in the real game.
   Nodes without a `shape` field use the engine default [150,80]. */
const SHAPE_SIZE={photo:[140,92],wide:[170,100],bubble:[150,80],logo:[150,80],chart:[130,64],news:[150,84],made:[140,74],mpc:[164,96],sat:[170,90]};
const sizeOf=n=>SHAPE_SIZE[n.shape]||[150,80];
const figRatio=n=>{const[a,b]=sizeOf(n);return(a-10)+'/'+(b-22)};
DATA.forEach(n=>{DIS[n.id]=n.name.join(' ')});
function chipsRow(n){
 const rel=(n.rel||[]).map(id=>'<button class="chip" data-x="'+id+'">'+esc(DIS[id]||id)+'</button>').join('');
 const evt=(n.evt||[]).map(e=>'<button class="erev" data-e="'+e[0]+'">'+esc(e[1])+'</button>').join('');
 let rows='';
 if(rel)rows+='<div class="chiprow"><span class="lab">↔ DEALS WITH</span>'+rel+'</div>';
 if(evt)rows+='<div class="chiprow"><span class="lab">🎴 ON THE DECK</span>'+evt+'</div>';
 return rows;
}
function cardHtml(n){
 const img=n.img,icon=n.icon||'•',type=n.type;
 const tags=[];
 tags.push('<span class="pill t" style="--c:'+TYPE_META[type].c+'">'+type+'</span>');
 tags.push('<span class="pill k">+$'+n.inc+' / TURN</span>');
 tags.push('<span class="pill k">SEIZE $'+n.cost+'</span>');
 if(HI_SET.has(n.id))tags.push('<span class="pill" title="High-value seed: dealt far from Quikstop">⤢ FAR OUT</span>');
 if(n.geo)tags.push('<span class="pill g">🌍 GEO DLC</span>');
 return '<article class="card'+(n.geo?' geo':'')+'" id="x-'+n.id+'" data-id="'+n.id+'" style="--c:'+TYPE_META[type].c+'">'
  +'<div class="fig">'+(n.img?'<img loading="lazy" decoding="async" style="aspect-ratio:'+figRatio(n)+'" src="'+encodeURI(img)+'" alt="'+esc(n.name.join(' '))+'" onerror="this.parentNode.innerHTML=\'<div class="ph">'+esc(icon)+'</div>\'">':'<div class="ph" style="aspect-ratio:'+figRatio(n)+'">'+esc(icon)+'</div>')+'</div>'
  +'<div><div class="nmrow"><h3 class="nm">'+esc(n.name.join(' '))+'</h3></div><div class="pillrow">'+tags.join('')+'</div></div>'
  +'<p class="sub">'+esc(n.sub)+'</p>'
  +'<p class="shot">'+n.short+'</p>'
  +'</article>';
}
function renderSections(){
 const visible=DATA.filter(n=>showGeo||!n.geo);
 let html='';
 TYPE_ORDER.forEach(t=>{
  const list=visible.filter(n=>n.type===t);
  if(!list.length)return;
  if(onlyTypes.size&&!onlyTypes.has(t))return;
  const m=TYPE_META[t];
  html+='<section class="sec" style="--c:'+m.c+'"><div class="sechead"><h2>'+t+'</h2><span class="sflav">'+m.flav+'</span><span class="scount">'+list.length+' EXHIBIT'+(list.length!==1?'S':'')+(t==='REGULATOR'?' · THERE ARE ONLY '+(showGeo?5:4)+' ON THE BOARD':'')+'</span></div><div class="cards">'+list.map(cardHtml).join('')+'</div></section>';
 });
 $('grid').innerHTML=html||'<p style="color:#8a7a5f;font-style:italic;margin-top:30px">Nothing on the wall matches that.</p>';
 applySearchDim();
 $('counts').innerHTML='<b>'+visible.length+'</b> exhibits · '+TYPE_ORDER.filter(t=>visible.some(n=>n.type===t)).map(t=>'<span style="color:'+TYPE_META[t].c+'">'+t+'</span>').join(' · ')+' · <b style="color:#8fd">'+DATA.filter(n=>n.geo&&showGeo).length+' / '+DATA.filter(n=>n.geo).length+' 🌍 GEO</b>';
}
function applySearchDim(){
 const q=query.trim().toLowerCase();
 const hayFor=n=>(DIS[n.id]+' '+n.type+' '+n.sub+' '+n.short+' '+n.mech.replace(/<[^>]+>/g,' ')+' '+(n.rel||[]).map(r=>DIS[r]).join(' ')).toLowerCase();
 document.querySelectorAll('#grid .card').forEach(c=>{
  const n=DATA.find(d=>d.id===c.dataset.id);
  let hit=!q;
  if(q){hit=hayFor(n).includes(q);c.classList.toggle('dim',!hit);}
  else c.classList.remove('dim');
  c.classList.toggle('hit',hit&&!!q);
 });
}

/* ================= interactions ================= */
document.addEventListener('click',e=>{
 const c=e.target.closest('.tchip'); 
 if(c&&c.id&&c.id!=='chipAll'){
  const t=c.dataset.t;
  if(onlyTypes.has(t))onlyTypes.delete(t);else onlyTypes.add(t);
  onlyTypes.size?c.classList.add('on'):c.classList.remove('on');
  $('chipAll').classList.toggle('on',!onlyTypes.size);
  renderSections();return;
 }
 if(c&&c.id==='chipAll'){onlyTypes.clear();document.querySelectorAll('#chips .tchip').forEach(x=>x.classList.remove('on'));c.classList.add('on');renderSections();return;}
 const x=e.target.closest('.xref,[data-x]');
 if(x&&x.dataset&&(x.dataset.x!==undefined||x.dataset.id!==undefined)){openNode(x.dataset.x||x.dataset.id);return;}
 const ev=e.target.closest('.erev');
 if(ev&&(ev.dataset.ev||ev.dataset.e)){openEvent(ev.dataset.ev||ev.dataset.e);return;}
 const card=e.target.closest('.card[data-id]');
 if(card&&!e.target.closest('button'))openNode(card.dataset.id);
});
$('geoToggle').addEventListener('change',e=>{showGeo=e.target.checked;$('geoT').classList.toggle('on',showGeo);renderSections();});
$('search').addEventListener('input',e=>{query=e.target.value;applySearchDim();});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=document.querySelector('#grid .card.hit:not(.dim),#grid .card:not(.dim)');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}});
/* ── modal ── */
let curModal=null,modalOrder=[];
function modalOrderRefresh(){modalOrder=DATA.filter(n=>(showGeo||!n.geo)&&(!onlyTypes.size||onlyTypes.has(n.type))&&(!query.trim()||!document.querySelector('#x-'+n.id+'.dim')));}
function showOvl(html){$('mcard').innerHTML=html;$('ovl').classList.add('show');document.body.style.overflow='hidden';}
function closeOvl(){$('ovl').classList.remove('show');document.body.style.overflow='';curModal=null;$('mcard').innerHTML='';}
$('ovl').addEventListener('click',e=>{if(e.target.id==='ovl')closeOvl();});
window.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeOvl();
 if(e.key==='ArrowRight'&&curModal)stepModal(1);
 if(e.key==='ArrowLeft'&&curModal)stepModal(-1);
});
function stepModal(dir){
 modalOrderRefresh();
 const kind=curModal.split(':')[0],id=curModal.slice(kind.length+1);
 let i;
 if(kind==='event'){const ev=EVENTS.map(e=>e.id);i=ev.indexOf(id)+dir;i=((i%ev.length)+ev.length)%ev.length;openEvent(ev[i]);}
 else{const list=modalOrder.map(n=>n.id);i=list.indexOf(id)+dir;i=((i%list.length)+list.length)%list.length;openNode(list[i]);}
}
$('mclose').addEventListener('click',closeOvl);
function navBtns(id,kind){
 const ev=EVENTS;
 let i,can=false,len=1;
 if(kind==='event'){i=ev.findIndex(e=>e.id===id);can=ev.length>1;len=ev.length;}
 else{modalOrderRefresh();i=modalOrder.findIndex(n=>n.id===id);can=modalOrder.length>1;len=modalOrder.length;}
 return '<div id="mnav">'+(can?'<button id="mprev" title="Previous exhibit">‹</button><button id="mnext" title="Next exhibit">›</button>':'')+'</div>'
  +'<div id="mpos">'+(can?(i+1)+' / '+len:'')+'</div>';
}
const MOOD_COLOR={CALM:'#8fbf7f',BOOM:'#f5c542',PANIC:'#ff6b5e',FRENZY:'#e19bff'};
function modalBodyNode(n){
 const pills=['<span class="pill t" style="--c:'+TYPE_META[n.type].c+'">'+n.type+'</span>'
  ,'<span class="pill k">+$'+n.inc+' / TURN</span>','<span class="pill k">SEIZE $'+n.cost+'</span>'];
 if(HI_SET.has(n.id))pills.push('<span class="pill" title="High-value seed: dealt far from Quikstop">⤢ FAR OUT</span>');
 if(n.geo)pills.push('<span class="pill g">🌍 GEO DLC</span>');
 return '<div class="mhero">'+(n.img?'<img src="'+encodeURI(n.img)+'" alt="'+esc(n.name.join(' '))+'" onerror="this.parentNode.innerHTML=\'<div class=ph>'+esc(n.icon||'📌')+'</div>\'">':'<div class="ph">'+esc(n.icon||'📌')+'</div>')+'</div>'
  +'<div class="mbody"><h3 class="mname">'+esc(n.name.join(' '))+'</h3>'
  +'<p class="sub" style="margin:2px 0 0">'+esc(n.sub)+'</p>'
  +'<div class="pillrow" style="margin-top:6px">'+pills.join('')+'</div>'
  +'<div class="mmech">'+n.mech+'</div>'
  +chipsRow(n)
  +'</div>';
}
function openNode(id){
 const n=DATA.find(d=>d.id===id);if(!n)return;
 curModal='node:'+id;
 showOvl(modalBodyNode(n)+navBtns(id,'node'));
}
function modalBodyEvent(e){
 const c=MOOD_COLOR[e.mood]||'#8fbf7f';
 return '<div class="mhero"><div class="ph" style="font-size:96px;height:220px">'+e.icon+'</div></div>'
  +'<div class="mbody"><h3 class="mname">'+esc(e.title)+'</h3>'
  +'<div class="pillrow" style="margin:8px 0 10px"><span class="pill k" style="border-color:'+c+';color:'+c+'">'+(e.mood==='—'?'MOOD UNCHANGED':'MOOD: '+e.mood)+'</span></div>'
  +'<p class="sub">'+esc(e.tag)+'</p>'
  +'<div class="mmech"><ul>'+e.pay.map(p=>'<li>'+p+'</li>').join('')+'</ul></div>'
  +'</div>';
}
function openEvent(id){
 const e=EVBY[id];if(!e)return;
 curModal='event:'+id;
 showOvl(modalBodyEvent(e)+navBtns(id,'event'));
}
